function sceneInit(){
  scene.cv=$('#scene');scene.c=scene.cv.getContext('2d');scene.c.imageSmoothingEnabled=false;
  scene.cv.addEventListener('pointerdown',onScenePointer);
}
function floorY(f,s){return SAND_Y+3-s.feet+s.h/2;}
function rtFor(f){
  let r=scene.rt.get(f.id);
  if(!r){
    const kind=kindOf(f),s=getSprite(f,stageOf(f),f.sick);
    r={x:rnd(20,140),y:kind==='fish'?rnd(20,90):(kind==='jelly'?rnd(25,60):floorY(f,s)),tx:80,ty:60,dir:Math.random()<0.5?-1:1,wait:rnd(0,1.5),phase:rnd(0,6.28),pp:Math.random(),
      turn:0,shim:0,flee:0,chase:0,chaseT:0,nibble:false,hop:0,hopV:0,molt:rnd(90,240),sleep:false};
    scene.rt.set(f.id,r);
  }
  return r;
}
function feedFlakes(){
  if(scene.food.length>30) return false;
  for(let i=0;i<7;i++){
    const fx=rnd(28,132);
    scene.food.push({x:fx,y:rnd(2,10),vy:rnd(7,12),floor:false,t:0});
    burst('plunge',fx,3,{n:2});
  }
  ripple(rnd(40,70),2,15,{ry:0.25});ripple(rnd(90,120),2,12,{ry:0.25,dur:0.8});
  return true;
}
function addFx(type,x,y){scene.fx.push({type,x,y,t:0});if(scene.fx.length>40) scene.fx.shift();}
function onStageUp(f,st){
  if(st>0) qJuice({kind:'grow',id:f.id});
  if(kindOf(f)==='shrimp'&&st>0){
    const r=scene.rt.get(f.id);
    if(r) scene.shells.push({id:f.id,x:r.x,y:r.y,t:40});
  }
}
function nearestFlake(r,floorOnly,maxD){
  let best=null,bd=maxD||1e9;
  for(const fl of scene.food){
    if(floorOnly&&!fl.floor) continue;
    const d=Math.hypot(fl.x-r.x,fl.y-r.y);
    if(d<bd){bd=d;best=fl;}
  }
  return best;
}
function traitSpeed(tr){return tr==='lazy'?0.7:(tr==='bold'?1.15:(tr==='playful'?1.1:(tr==='shy'?0.9:1)));}

function pickFishTarget(f,r,sp,st,night){
  const tr=f.trait,plants=plantXs();
  r.nibble=false;
  if(r.chase){
    const o=S.fish.find(x=>x.id===r.chase),orr=o&&scene.rt.get(o.id);
    if(orr&&r.chaseT>0){r.tx=orr.x;r.ty=orr.y;return;}
    r.chase=0;
  }
  if(night>0.6){r.tx=rnd(10,150);r.ty=SAND_Y-rnd(6,24);return;}
  if(tr==='playful'&&Math.random()<0.2){
    const others=S.fish.filter(x=>x.id!==f.id&&kindOf(x)==='fish'&&scene.rt.get(x.id));
    if(others.length){const o=pick(others),orr=scene.rt.get(o.id);r.chase=o.id;r.chaseT=rnd(4,8);r.tx=orr.x;r.ty=orr.y;return;}
  }
  if(sp.algae&&S.algae>10&&Math.random()<0.4){r.nibble=true;r.tx=Math.random()<0.5?9:151;r.ty=rnd(35,92);return;}
  if((st===0||tr==='shy')&&plants.length&&Math.random()<0.7){r.tx=pick(plants)+rnd(-9,9);r.ty=SAND_Y-rnd(5,24);return;}
  if(tr==='shy'){r.tx=rnd(10,150);r.ty=rnd(SAND_Y-26,SAND_Y-6);return;}
  const buddies=S.fish.filter(x=>x.id!==f.id&&x.sp===f.sp&&scene.rt.get(x.id));
  if(buddies.length&&(tr==='social'?Math.random()<0.8:Math.random()<0.22)){
    const br=scene.rt.get(pick(buddies).id);
    r.tx=clamp(br.x+rnd(-14,14),8,152);r.ty=clamp(br.y+rnd(-8,8),10,SAND_Y-8);return;
  }
  const band=tr==='bold'?rnd(0.1,0.9):sp.dep;
  r.tx=rnd(10,150);r.ty=clamp(14+band*84+rnd(-16,16),10,SAND_Y-8);
}
function moveFish(f,r,sp,st,night,dt,speed,hungryFood){
  if(hungryFood){
    const fl=nearestFlake(r,false);
    if(fl){r.tx=fl.x;r.ty=fl.y;speed*=1.7;r.wait=0;r.chase=0;}
  }
  if(r.chase){
    speed*=1.45;r.chaseT-=dt;
    const o=S.fish.find(x=>x.id===r.chase),orr=o&&scene.rt.get(o.id);
    if(orr){
      r.tx=orr.x;r.ty=orr.y;
      if(Math.hypot(orr.x-r.x,orr.y-r.y)<9){orr.flee=1.2;r.chaseT-=1.5;addFx('bub',orr.x,orr.y);}
    }
  }
  if(r.wait>0){r.wait-=dt;return;}
  const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
  if(d<2.5){
    r.wait=rnd(0.3,2.4)*(f.trait==='lazy'?2.2:1)*(r.nibble?2.5:1);
    if(r.nibble) S.algae=Math.max(0,S.algae-1.2);
    pickFishTarget(f,r,sp,st,night);
  }else{
    const s=Math.min(d,speed*dt);
    r.x+=dx/d*s;r.y+=dy/d*s;
    if(Math.abs(dx)>3){const nd=dx<0?-1:1;if(nd!==r.dir){r.dir=nd;r.turn=0.2;}}
  }
}
function moveShrimp(f,r,sp,st,night,dt,speed,hungryFood,s){
  const fy=floorY(f,s);
  if(r.hop>0){
    r.hop-=dt;r.hopV+=70*dt;r.y+=r.hopV*dt;
    r.x+=r.dir*speed*1.5*dt;
    if(r.y>=fy){r.y=fy;r.hop=0;}
    r.x=clamp(r.x,6,154);
    return;
  }
  r.y=fy;
  if(hungryFood){
    const fl=nearestFlake(r,true);
    if(fl){r.tx=fl.x;speed*=2;r.wait=0;}
  }
  if(r.wait>0){r.wait-=dt;return;}
  const dx=r.tx-r.x;
  if(Math.abs(dx)<2){
    r.wait=rnd(1,4)*(f.trait==='lazy'?1.8:1);
    r.tx=rnd(10,150);
    if(f.trait==='shy'&&plantXs().length&&Math.random()<0.6) r.tx=pick(plantXs())+rnd(-10,10);
    if(st>0&&Math.random()<(f.trait==='playful'?0.3:0.1)&&night<0.5){r.hop=1;r.hopV=-34;}
  }else{
    r.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*dt);
    const nd=dx<0?-1:1;if(nd!==r.dir){r.dir=nd;r.turn=0.2;}
  }
}
function moveJelly(f,r,sp,st,night,dt,speed,hungryFood,s){
  if(sp.floor){
    r.y=SAND_Y+2-s.h/2+2;
    if(r.wait>0){r.wait-=dt;return;}
    const dx=r.tx-r.x;
    if(Math.abs(dx)<2){r.wait=rnd(6,16);r.tx=rnd(14,146);}
    else r.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*0.5*dt);
    return;
  }
  const up=r.pp<0.5;
  let vy=up?-12*(1-r.pp*2*0.6):4.5;
  if(r.y<r.ty-4) vy+=up?5:6;
  if(r.y>r.ty+10) vy-=up?0:2;
  r.y=clamp(r.y+vy*dt*(1-night*0.3),10,SAND_Y-s.h-4);
  if(hungryFood){const fl=nearestFlake(r,false,60);if(fl){r.tx=fl.x;r.ty=fl.y-8;}}
  const dx=r.tx-r.x;
  if(Math.abs(dx)<3&&r.wait<=0){r.wait=rnd(2,6);}
  if(r.wait>0){r.wait-=dt;if(Math.abs(dx)<3) return;}
  if(Math.abs(dx)>=3){
    r.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*(up?1.4:0.5)*dt);
    const nd=dx<0?-1:1;if(nd!==r.dir){r.dir=nd;}
  }else if(r.wait<=0){
    r.tx=rnd(14,146);r.ty=rnd(16,SAND_Y-40);
  }
  if(Math.abs(dx)<3){r.tx=rnd(14,146);r.ty=rnd(16,SAND_Y-40);}
}

function updateScene(dt){
  const night=1-dayLight();
  const alive=new Set();
  const showSound=curTab==='tank'&&!sheetState;
  for(const f of S.fish){
    alive.add(f.id);
    const r=rtFor(f),sp=SP[f.sp],st=stageOf(f),kind=kindOf(f),tr=f.trait;
    const s=getSprite(f,st,f.sick);
    if(r.mv===undefined){r.mv=0;r.wag=rnd(0,6.28);r.sq=0;}
    const px=r.x,py=r.y;
    r.sq=Math.max(0,r.sq-dt);
    r.phase+=dt*(f.sick?2:4);
    r.turn=Math.max(0,r.turn-dt);r.shim=Math.max(0,r.shim-dt);
    if(r.flee>0) r.flee-=dt;
    r.sleep=night>0.6&&!f.sick&&!(scene.food.length>0&&f.hunger<92);
    const limit=tr==='greedy'?98:92;
    const hungryFood=f.hunger<limit&&scene.food.length>0&&!r.sleep;
    let speed=sp.spd*16*(st===0?1.25:1)*(f.sick?0.45:1)*(1-night*0.6)*traitSpeed(tr);
    if(r.sleep) speed*=0.35;
    if(r.flee>0) speed*=2.4;
    if(kind==='jelly') r.pp=(r.pp+dt*0.4*(sp.pulse||1))%1;
    if(kind==='fish'||sp.glide) moveFish(f,r,sp,st,night,dt,speed,hungryFood);
    else if(kind==='shrimp') moveShrimp(f,r,sp,st,night,dt,speed,hungryFood,s);
    else moveJelly(f,r,sp,st,night,dt,speed,hungryFood,s);
    r.x=clamp(r.x,6,154);
    if(kind==='fish') r.y=clamp(r.y,8,SAND_Y-4);
    else if(sp.glide) r.y=clamp(r.y,8,SAND_Y-s.h/2-4);
    r.mv+=(Math.hypot(r.x-px,r.y-py)/Math.max(dt,0.001)-r.mv)*Math.min(1,dt*6);
    r.wag+=dt*(5+Math.min(r.mv,24)*0.3);
    if(r.sleep&&showSound&&Math.random()<dt*0.45) addFx('z',r.x+(r.dir<0?-4:4),r.y-s.h/2-2);
    if(kind==='shrimp'&&st>0){
      r.molt-=dt;
      if(r.molt<=0){r.molt=rnd(120,300);if(f.hunger>50&&!f.sick) scene.shells.push({id:f.id,x:r.x,y:r.y,t:40});}
    }
  }
  for(const b of S.fish){
    if(b.sp!=='box') continue;
    const br=scene.rt.get(b.id);if(!br) continue;
    for(const o of S.fish){
      if(o===b||o.sp==='box'||kindOf(o)==='shrimp') continue;
      const orr=scene.rt.get(o.id);
      if(!orr||orr.flee>0||Math.hypot(orr.x-br.x,orr.y-br.y)>16) continue;
      orr.flee=0.9;orr.wait=0;
      orr.tx=clamp(orr.x+(orr.x-br.x)*3+rnd(-10,10),8,152);
      orr.ty=clamp(orr.y+(orr.y-br.y)*3+rnd(-10,10),12,SAND_Y-10);
      addFx('bub',orr.x,orr.y-4);
    }
  }
  for(const id of [...scene.rt.keys()]) if(!alive.has(id)) scene.rt.delete(id);
  /* food */
  for(let i=scene.food.length-1;i>=0;i--){
    const fl=scene.food[i];
    if(fl.floor){
      fl.t-=dt;
      if(fl.t<=0){S.waste=Math.min(100,S.waste+0.35);scene.food.splice(i,1);continue;}
    }else{
      fl.y+=fl.vy*dt;
      if(fl.y>=SAND_Y-2){fl.floor=true;fl.t=16;fl.y=SAND_Y-1;burst('sand',fl.x,SAND_Y-1,{n:3});}
    }
    let eaten=false;
    for(const f of S.fish){
      if(f.hunger>=95) continue;
      const r=scene.rt.get(f.id);if(!r) continue;
      const kind=kindOf(f);
      const rx=kind==='jelly'?9:(kind==='shrimp'?5:6),ry=kind==='jelly'?10:(kind==='shrimp'?5:5);
      if(kind==='shrimp'&&!fl.floor) continue;
      if(Math.abs(fl.x-r.x)<rx&&Math.abs(fl.y-r.y)<ry+(kind==='shrimp'?3:0)){
        f.hunger=Math.min(100,f.hunger+12);eaten=true;
        r.sq=0.32;burst('crumbs',r.x+(r.dir>0?3:-3),r.y,{n:3});
        if(showSound) sfx.eat();
        if(f.hunger>=95&&mood(f)[1]==='good'&&Math.random()<0.55) addFx('heart',r.x,r.y-6);
        if(Math.random()<0.5) scene.bubbles.push({x:r.x+r.dir*-4,y:r.y-2,vy:rnd(8,14),s:1});
        break;
      }
    }
    if(eaten){scene.food.splice(i,1);}
  }
  /* bubbles */
  const hasBubbler=S.decor.slots.includes('bubbler');
  if(hasBubbler&&Math.random()<dt*9){const i=S.decor.slots.indexOf('bubbler');scene.bubbles.push({x:SLOT_X[i]+rnd(-2,2),y:SAND_Y-6,vy:rnd(14,26),s:Math.random()<0.3?2:1});if(showSound&&Math.random()<0.2) sfx.bubble();}
  if(Math.random()<dt*0.7){scene.bubbles.push({x:rnd(8,152),y:SAND_Y-2,vy:rnd(6,12),s:1});if(showSound&&Math.random()<0.3) sfx.bubble();}
  const chest=S.decor.slots.indexOf('chest');
  if(chest>=0&&Math.sin(scene.t*0.6)>0.92&&Math.random()<dt*10) scene.bubbles.push({x:SLOT_X[chest]+rnd(-3,3),y:SAND_Y-12,vy:rnd(14,24),s:1});
  for(let i=scene.bubbles.length-1;i>=0;i--){const b=scene.bubbles[i];b.y-=b.vy*dt;b.x+=Math.sin(scene.t*3+b.y*0.2)*0.15;if(b.y<2) scene.bubbles.splice(i,1);}
  if(scene.bubbles.length>60) scene.bubbles.splice(0,scene.bubbles.length-60);
  for(let i=scene.fx.length-1;i>=0;i--){const e=scene.fx[i];e.t+=dt;if(e.t>1.4) scene.fx.splice(i,1);}
  for(let i=scene.shells.length-1;i>=0;i--){const e=scene.shells[i];e.t-=dt;if(e.t<=0) scene.shells.splice(i,1);}
  updateJuice(dt);
}

const HEART=['.#.#.','#####','.###.','..#..'];
const ZZ=['###','.#.','###'];
function drawGlyph(c,rows,x,y,col){
  c.fillStyle=col;
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++) if(r[i]==='#') c.fillRect(Math.round(x)+i,Math.round(y)+j,1,1);});
}
function drawSpr(c,s,r,x,y,flipX,flipY,sx,frame,extra,sy,wig){
  c.save();
  const cx=Math.round(x+s.w/2),cy=Math.round(y+s.h/2);
  c.translate(cx,cy);
  c.scale((flipX?-1:1)*(sx||1),(flipY?-1:1)*(sy||1));
  const ox=-Math.round(s.w/2),oy=-Math.round(s.h/2);
  if(wig>0.02&&!REDUCED){
    /* tail ripple: slide each pixel column up/down, more toward the tail (head is on the left) */
    const W=frame.width,H=frame.height,ph=r.wag||0;
    for(let ix=0;ix<W;ix++){
      const u=ix/W,dy=Math.round(Math.sin(ph-ix*0.42)*wig*u*u*1.7);
      c.drawImage(frame,ix,0,1,H,ox+ix,oy+dy,1,H);
    }
  }else c.drawImage(frame,ox,oy);
  if(extra){c.translate(ox,oy);extra(c);}
  c.restore();
}
function drawScene(){
  const c=scene.c,t=scene.t,th=THEMES.find(x=>x.id===S.theme)||THEMES[0];
  if(scene.bgTheme!==th.id){scene.bg=buildBg(th);scene.bgTheme=th.id;}
  const light=dayLight(),night=1-light;
  c.globalCompositeOperation='source-over';
  c.drawImage(scene.bg,0,0);
  c.fillStyle='rgba(255,255,255,'+(0.05+0.05*light).toFixed(3)+')';
  for(let i=0;i<4;i++){
    const bx=((i*46+t*2.2)%200)-24;
    c.beginPath();c.moveTo(bx,0);c.lineTo(bx+14,0);c.lineTo(bx+4,SAND_Y);c.lineTo(bx-20,SAND_Y);c.closePath();c.fill();
  }
  drawAmbientBack(c,t,light);
  /* decor behind creatures */
  S.decor.slots.forEach((id,i)=>{if(id&&DRAW[id]&&!DECOR[id].plant) DRAW[id](c,SLOT_X[i],SAND_Y+2,t);});
  /* molted shells */
  for(const e of scene.shells){
    const f=S.fish.find(x=>x.id===e.id);if(!f) continue;
    const s=getSprite(f,stageOf(f),false);
    c.globalAlpha=Math.min(0.45,e.t/40*0.45);
    c.save();c.translate(Math.round(e.x),Math.round(SAND_Y+3-s.feet+s.h*0.5+s.h/2-s.h*0.5));c.scale(1,1);c.drawImage(s.cv,-Math.round(s.w/2),-Math.round(s.h/2));c.restore();
    c.globalAlpha=1;
  }
  /* polyps */
  S.polyps.forEach((p,j)=>drawPolyp(c,p,18+j*26,SAND_Y+12,t));
  /* coin pile */
  const coins=Math.min(14,Math.floor(S.pile));
  if(coins>0){
    const rows=[5,4,3,2],px=147,py=SAND_Y+14;let n=0;
    for(let ri2=0;ri2<rows.length&&n<coins;ri2++){
      for(let k=0;k<rows[ri2]&&n<coins;k++,n++){
        const cx=px-rows[ri2]*2+k*4+1,cy=py-ri2*3;
        R(c,'#b8860b',cx,cy+1,4,2);R(c,'#f4c542',cx,cy,4,2);R(c,'#fff1a8',cx+1,cy,2,1);
      }
    }
    if(Math.sin(t*5)>0.8) R(c,'#fff',px+Math.round(Math.sin(t*9)*6),py-8,1,1);
  }
  /* creatures */
  const order=[...S.fish].sort((a,b)=>{
    const fa=SP[a.sp].dep,fb=SP[b.sp].dep;return fb-fa;
  });
  const carriers=new Set(S.eggs.filter(e=>e.carrier).map(e=>e.carrier));
  for(const f of order){
    const r=scene.rt.get(f.id);if(!r) continue;
    const s=getSprite(f,stageOf(f),f.sick),sp=SP[f.sp];
    const bob=sp.floor?0:(s.jelly?0:Math.sin(r.phase)*0.6);
    const shim=r.shim>0?Math.round(Math.sin(r.shim*45)*1.6):0;
    const x=Math.round(r.x-s.w/2)+shim,y=Math.round(r.y-s.h/2+bob);
    if(s.glow){
      const cx=x+s.w/2,cy=y+s.h/2,rad=Math.max(s.w,s.h)*(0.95+0.1*Math.sin(t*2+r.phase));
      const gc=s.glowRGB.join(',');
      const gr=c.createRadialGradient(cx,cy,1,cx,cy,rad);
      gr.addColorStop(0,'rgba('+gc+','+(0.35+0.35*night)+')');gr.addColorStop(1,'rgba('+gc+',0)');
      c.globalCompositeOperation='lighter';c.fillStyle=gr;c.fillRect(cx-rad,cy-rad,rad*2,rad*2);c.globalCompositeOperation='source-over';
    }
    const frame=s.jelly?s.frames[Math.floor(r.pp*4)%4]:s.cv;
    let sx=r.turn>0?(0.2+0.8*(1-r.turn/0.2)):1,sy=1;
    if(r.sq>0&&!REDUCED){
      /* squash then stretch, springing back */
      const u=Math.min(1,r.sq/0.4),q=u*Math.cos((1-u)*Math.PI*2.4);
      sx*=1+0.24*q;sy=1-0.2*q;
    }
    const wig=SP[f.sp].kind==='fish'?(r.sleep?0.15:(f.sick?0.25:0.45+Math.min(1,(r.mv||0)/14)*0.9)):0;
    const flipX=r.dir>0,flipY=false;
    const berried=carriers.has(f.id)&&s.eggPos;
    drawSpr(c,s,r,x,y,flipX,flipY,sx,frame,berried?(cc=>{
      for(let k=0;k<4;k++){cc.fillStyle=k%2?'#8fd36a':'#c6e86a';cc.fillRect(s.eggPos.x-k,s.eggPos.y+(k%2),1,1);}
    }):null,sy,wig);
    if(s.pearl&&Math.sin(t*3+r.phase*2)>0.94){const px=x+Math.round(s.w*0.45),py=y+Math.round(s.h*0.4);R(c,'#fff',px,py,1,1);R(c,'#fff',px-1,py,3,1);R(c,'#fff',px,py-1,1,3);}
    if(f.sick){R(c,'#7ee08a',x+s.w/2-1,y-6,3,1);R(c,'#7ee08a',x+s.w/2,y-7,1,3);}
    else if(f.hunger<30){R(c,'#ffd166',x+s.w/2,y-7,1,3);R(c,'#ffd166',x+s.w/2,y-3,1,1);}
  }
  /* plants in front so small creatures can hide behind them */
  S.decor.slots.forEach((id,i)=>{if(id&&DRAW[id]&&DECOR[id].plant) DRAW[id](c,SLOT_X[i],SAND_Y+2,t);});
  for(const fl of scene.food) R(c,fl.floor?'#c98a3a':'#e8a04a',fl.x,fl.y,2,2);
  for(const b of scene.bubbles){c.fillStyle='rgba(255,255,255,.55)';c.fillRect(Math.round(b.x),Math.round(b.y),b.s,b.s);if(b.s>1){c.fillStyle='rgba(255,255,255,.9)';c.fillRect(Math.round(b.x),Math.round(b.y),1,1);}}
  for(const e of scene.fx){
    const a=Math.max(0,1-e.t/1.4);
    c.globalAlpha=a;
    if(e.type==='heart') drawGlyph(c,HEART,e.x-2,e.y-e.t*9,'#ff6b8b');
    else if(e.type==='z') drawGlyph(c,ZZ,e.x,e.y-e.t*6,'#e8f4ff');
    else {c.fillStyle='#fff';c.fillRect(Math.round(e.x+Math.sin(e.t*9)*3),Math.round(e.y-e.t*8),1,1);}
    c.globalAlpha=1;
  }
  drawRipples(c);
  drawMurk(c);
  drawAlgae(c);
  drawSwirl(c);
  if(night>0.02){c.fillStyle='rgba(8,18,60,'+(night*0.2).toFixed(3)+')';c.fillRect(0,0,SW,SH);}
  drawWipe(c);
  drawParts(c);
  if(scene.decorMode){
    SLOT_X.forEach((x,i)=>{
      const a=0.55+0.35*Math.sin(t*4+i);
      c.fillStyle='rgba(255,179,71,'+a.toFixed(2)+')';
      c.fillRect(x-8,SAND_Y+6,16,1);c.fillRect(x-8,SAND_Y+14,16,1);c.fillRect(x-8,SAND_Y+6,1,9);c.fillRect(x+7,SAND_Y+6,1,9);
      if(!S.decor.slots[i]){c.fillRect(x-3,SAND_Y+10,7,1);c.fillRect(x,SAND_Y+7,1,7);}
    });
  }
}
function sceneLoop(ts){
  if(!scene.running) return;
  const dt=Math.min(0.1,(ts-scene.last)/1000||0.016);
  scene.last=ts;scene.t+=dt;
  if(S){updateScene(dt);drawScene();}
  requestAnimationFrame(sceneLoop);
}
function sceneStart(){
  if(scene.running) return;
  scene.running=true;scene.last=performance.now();requestAnimationFrame(sceneLoop);
}
function sceneStop(){scene.running=false;}
function onScenePointer(e){
  const r=scene.cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*SW,y=(e.clientY-r.top)/r.height*SH;
  if(scene.decorMode){
    if(y>SAND_Y-26){
      let bi=0,bd=1e9;SLOT_X.forEach((sx,i)=>{const d=Math.abs(sx-x);if(d<bd){bd=d;bi=i;}});
      openSheet('decor',bi);return;
    }
  }
  if(S.pile>=1&&x>128&&y>SAND_Y-6){doCollect();return;}
  if(y>SAND_Y+2){
    for(let j=0;j<S.polyps.length;j++){
      if(Math.abs(x-(18+j*26))<13){audioResume();sfx.tap();openSheet('polyp',S.polyps[j].id);return;}
    }
  }
  let hit=null,bd=1e9;
  for(const f of S.fish){
    const rt=scene.rt.get(f.id);if(!rt) continue;
    const s=getSprite(f,stageOf(f),f.sick);
    const dx=Math.abs(x-rt.x),dy=Math.abs(y-rt.y);
    if(dx<=s.w/2+5&&dy<=s.h/2+5){const d=dx+dy;if(d<bd){bd=d;hit=f;}}
  }
  if(hit){
    audioResume();sfx.fish();
    const rt=scene.rt.get(hit.id);
    if(rt){
      rt.shim=0.7;rt.sq=0.4;
      ripple(rt.x,rt.y,9);
      if(hit.trait==='shy'){rt.flee=1.4;}
      else if(hit.trait==='lazy'){addFx('z',rt.x,rt.y-8);}
      else addFx('heart',rt.x,rt.y-6);
    }
    openSheet('fish',hit.id);
  }else waterTap(x,y);
}
/* ================= species spec (hybrids blend body size from both parents) ================= */
function spriteSpec(f){
  const A=SP[f.sp],B=f.hyb&&SP[f.hyb];
  if(!B||B.kind!==A.kind) return A;
  return Object.assign({},A,{
    len:Math.round((A.len+B.len)/2),hei:Math.round((A.hei+B.hei)/2),
    tailMul:((A.tailMul||1)+(B.tailMul||1))/2,finMul:((A.finMul||1)+(B.finMul||1))/2
  });
}

/* ================= jellyfish sprites: one shape per real-life kind, 4 pulse frames each ================= */
const put=(g,x,y,hex,a)=>{
  x=Math.round(x);y=Math.round(y);
  if(y>=0&&y<g.length&&x>=0&&x<g[0].length) g[y][x]=rgba(hex,a==null?1:a);
};
function hsl2hex(h,s,l){
  h=((h%360)+360)%360;s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgbHex([f(0)*255,f(8)*255,f(4)*255]);
}
function jctx(f,stage,sick){
  const sp=spriteSpec(f),ph=phenotype(f);
  const sm=(0.88+0.12*ph.size)*1.25,stm=[0.45,0.75,1][stage];
  return {sp,ph,sick,
    tc:c=>sick?mixHex(c,'#7d8a70',0.5):c,
    base:COLORS[ph.color].c,acc:COLORS[ph.accent].c,
    BW:Math.max(5,Math.round(sp.len*sm*stm)),BH:Math.max(4,Math.round(sp.hei*sm*stm))};
}
/* bell pattern genes: same eight patterns on every shape */
function jPat(pat,x,y,cx,y0,bh,c,hs){
  const vv=(y-y0)/Math.max(bh,1);
  switch(pat){
    case 1: return ((x-Math.floor(cx))%3===0)&&vv>0.2;
    case 2: return (hs%8===0)&&vv>0.15&&vv<0.85;
    case 3: {const d=Math.hypot(x+0.5-cx,(y-(y0+bh))*0.9);return (Math.floor(d)%4===0)&&d>2;}
    case 4: {const d=Math.hypot(x+0.5-cx,(y-(y0+bh*0.62))*1.4);return (d>1.5&&d<3.6)&&((x+0.5-cx)!==0);}
    case 5: return vv<0.3;
    case 6: return hs%4===0;
    case 7: return ((x+y+Math.floor(c*3))%4<1)&&vv>0.15;
  }
  return false;
}
function jOutline(g,cells,oc){
  const W=g[0].length;
  for(const key of cells){
    const y=Math.floor(key/1000),x=key%1000;
    if(y>0&&!cells.has((y-1)*1000+x)&&!g[y-1][x]) g[y-1][x]=oc;
    if(x>0&&!cells.has(y*1000+x-1)&&!g[y][x-1]) g[y][x-1]=oc;
    if(x<W-1&&!cells.has(y*1000+x+1)&&!g[y][x+1]) g[y][x+1]=oc;
  }
}
function jFinish(frames,X){
  const f0=frames[0];
  return {cv:f0,frames,w:f0.width,h:f0.height,glow:X.ph.sheen===1,pearl:X.ph.sheen===2,glowRGB:hexRgb(lighten(X.base,0.3)),jelly:true,feet:f0.height-2};
}
const TWO_PI=Math.PI*2;

/* Moon jelly: flat saucer, four glowing rings, short fringe */
function jbSaucer(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail,at=ph.fin;
  const FR=Math.max(2,Math.round(BH*[0.35,0.6,0.45,0.5,0.9][tt]));
  const ARM=Math.max(3,Math.round(BH*[0.55,0.7,0.9,1.1][at]));
  const W=Math.round(BW*1.25)+6,Hc=Math.round(BH*1.15)+Math.max(FR,ARM)+8;
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1.06-0.16*c),bh=BH*(0.9+0.2*c);
    const g=emptyGrid(W,Hc),cx=W/2,y0=2,cells=new Set(),rim=new Map();
    for(let x=0;x<W;x++){
      const u=(x+0.5-cx)/(bw/2);
      if(Math.abs(u)>1) continue;
      const h=bh*Math.pow(1-u*u,0.55);
      const yTop=y0+bh-h,yBot=y0+bh-u*u*bh*0.2;
      rim.set(x,yBot);
      for(let y=Math.floor(yTop);y<=Math.floor(yBot);y++){
        const vv=(y-y0)/Math.max(bh,1),hs=hash2(x,y);
        let col=vv<0.3?lighten(base,0.5):(vv>0.8?mixHex(base,acc,0.5):base);
        let a=vv<0.3?0.9:(vv>0.8?0.9:0.7);
        if(jPat(ph.pattern,x,y,cx,y0,bh,c,hs)){col=acc;a=0.9;}
        if(ph.sheen===2&&vv<0.35) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    if(BW>=11){
      const ry=Math.round(y0+bh*0.5),rc=tc(mixHex(acc,'#ffffff',0.3));
      const ring=rx=>[[1,0],[2,0],[0,1],[3,1],[1,2],[2,2]].forEach(([dx,dy])=>put(g,rx+dx,ry+dy,rc,0.95));
      ring(Math.round(cx-bw*0.2-2));ring(Math.round(cx+bw*0.2-2));
    }
    const fcol=tc(acc);
    for(const [x,yb0] of rim){
      if(x%2) continue;
      const yb=Math.floor(yb0),len=FR*(0.7+0.3*((hash2(x,7)%100)/100));
      for(let j=1;j<=len;j++){
        const off=Math.sin(p*TWO_PI+j*0.7+x*0.5)*(tt===3?1.3:0.5);
        put(g,x+off,yb+j,fcol,j>len*0.7?0.35:0.6);
      }
    }
    const acol=tc(mixHex(acc,'#ffffff',0.35));
    for(let k=0;k<4;k++){
      const ax=cx+(k-1.5)*bw*0.11;
      for(let j=0;j<=ARM;j++){
        const off=Math.sin(p*TWO_PI+j*0.8+k*1.7)*(0.5+at*0.35)+((at>=2&&j%2)?0.6:-0.2);
        put(g,ax+off,y0+bh*0.92+j,acol,0.85);
        if(at>=2) put(g,ax+off+1,y0+bh*0.92+j,acol,0.55);
      }
    }
    jOutline(g,cells,rgba(tc(darken(base,0.5)),0.9));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

/* Sea nettle: tall scalloped bell with stripes, thick ruffled arms, very long streamers */
function jbNettle(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail,at=ph.fin;
  const TL=Math.round(BH*[1.5,1.9,1.7,1.8,2.4][tt]);
  const AL=Math.max(3,Math.round(BH*[0.7,0.9,1.1,1.3][at]));
  const W=Math.round(BW*1.4)+8,Hc=Math.round(BH*1.15)+TL+6;
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1.04-0.14*c),bh=BH*(0.92+0.16*c);
    const g=emptyGrid(W,Hc),cx=W/2,y0=2,cells=new Set();
    const lobeW=Math.max(2,Math.round(bw/5));
    for(let x=0;x<W;x++){
      const u=(x+0.5-cx)/(bw/2);
      if(Math.abs(u)>1) continue;
      const lobe=Math.floor((x+0.5-cx+bw/2)/lobeW);
      const h=bh*Math.sqrt(1-u*u);
      const yTop=y0+bh-h,yBot=y0+bh-((lobe%2)?1.4:0);
      for(let y=Math.floor(yTop);y<=Math.floor(yBot);y++){
        const vv=(y-y0)/Math.max(bh,1),hs=hash2(x,y);
        let col=vv<0.25?lighten(base,0.45):((lobe%2)?base:mixHex(base,acc,0.5));
        let a=vv<0.25?0.92:0.8;
        if(jPat(ph.pattern,x,y,cx,y0,bh,c,hs)){col=lighten(acc,0.15);a=0.92;}
        if(ph.sheen===2&&vv<0.35) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    const rimY=y0+bh;
    const acol=tc(mixHex(acc,'#ffffff',0.5));
    for(let k=0;k<4;k++){
      const ax=cx+(k-1.5)*bw*0.13;
      for(let j=0;j<=AL;j++){
        const off=Math.sin(p*TWO_PI+j*0.7+k*1.4)*1.1+((j%2)?0.7:-0.7)*(at>=1?1:0.5);
        const y=rimY-1+j;
        put(g,ax+off,y,acol,0.92);put(g,ax+off+1,y,acol,0.92);
        if(j%3===0){put(g,ax+off-1,y,acol,0.6);put(g,ax+off+2,y,acol,0.6);}
      }
    }
    const tcol=tc(darken(acc,0.1));
    for(let k=0;k<8;k++){
      const tx=cx-bw/2+(k+0.5)*bw/8;
      const len=Math.round(TL*(0.65+0.35*((hash2(k,5)%100)/100)));
      for(let j=1;j<=len;j++){
        let off=Math.sin(p*TWO_PI+j*0.45+k*1.1)*1.1*(0.3+0.7*j/len)+(k-3.5)*0.16*Math.min(j,10);
        if(tt===3&&j>len-5) off+=((k%2)?1:-1)*(j-(len-5))*0.7;
        const y=rimY+j;
        put(g,tx+off,y,tcol,j>len*0.8?0.35:0.65);
        if(tt===4) put(g,tx+off+1,y,tcol,0.5);
      }
    }
    jOutline(g,cells,rgba(tc(darken(base,0.5)),0.9));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

/* Upside-down jelly: flat disc lying on the sand, frilly arms reaching up like a flower */
function jbRosette(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail,at=ph.fin;
  const nA=[4,5,6,7,8][tt];
  const AH=Math.max(4,Math.round(BH*[1.4,1.7,2.0,2.4][at]));
  const DH=Math.max(3,Math.round(BH*0.55));
  const W=BW+10,Hc=AH+DH+8;
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1+0.05*c);
    const g=emptyGrid(W,Hc),cx=W/2,cells=new Set();
    const dB=Hc-3,dT=dB-DH;
    for(let x=0;x<W;x++){
      const u=(x+0.5-cx)/(bw/2);
      if(Math.abs(u)>1) continue;
      const hh=DH*Math.pow(1-u*u,0.45);
      for(let y=Math.floor(dB-hh);y<=dB;y++){
        const hs=hash2(x,y),top=y<dB-hh+1.4;
        let col=top?lighten(base,0.35):base,a=0.88;
        if(jPat(ph.pattern,x,y,cx,dT,DH,c,hs)){col=acc;a=0.9;}
        if(ph.sheen===2&&top) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    const stalk=tc(mixHex(acc,base,0.35)),knob=tc(lighten(acc,0.2));
    for(let k=0;k<nA;k++){
      const t=(k+0.5)/nA,ax=cx-bw*0.34+t*bw*0.68;
      const hk=Math.max(3,Math.round(AH*(0.65+0.35*((hash2(k,11)%100)/100))));
      for(let j=0;j<=hk;j++){
        const sway=Math.sin(p*TWO_PI+k*1.2)*0.9*(j/hk);
        const x=ax+sway,y=dT+DH*0.4-j;
        put(g,x,y,stalk,0.92);
        if(j<hk*0.4) put(g,x+1,y,stalk,0.8);
        if(at>=2&&j>hk*0.5&&j%2) put(g,x-1,y,knob,0.7);
      }
      const tx=ax+Math.sin(p*TWO_PI+k*1.2)*0.9,ty=dT+DH*0.4-hk;
      put(g,tx-1,ty,knob,0.95);put(g,tx,ty,knob,0.95);put(g,tx+1,ty,knob,0.95);put(g,tx,ty-1,knob,0.95);
      if(at>=1){put(g,tx-1,ty-1,knob,0.7);put(g,tx+1,ty-1,knob,0.7);}
      if(hash2(k,i)%5===0) put(g,tx,ty-2,'#ffffff',0.8);
    }
    jOutline(g,cells,rgba(tc(darken(base,0.45)),0.9));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

/* Comb jelly: clear oval, rainbow rows that ripple, two feathery tentacles */
function jbComb(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail,at=ph.fin;
  const TL=Math.round(BH*[1.3,1.8,1.5,2,2.4][tt]);
  const lobeL=[0,3,4,5][at];
  const W=Math.round(BW*2.2)+8,Hc=BH+TL+lobeL+8;
  const nR=3+(ph.pattern%4);
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1+0.03*c),bh=BH;
    const g=emptyGrid(W,Hc),cx=W/2,y0=2,cells=new Set();
    const half=y=>(bw/2)*Math.pow(Math.sin(Math.PI*Math.min(1,(y-y0+0.5)/bh)),0.75)*(1.05-0.2*((y-y0)/bh));
    for(let y=y0;y<y0+bh;y++){
      const hw=half(y);
      for(let x=Math.floor(cx-hw);x<=Math.ceil(cx+hw);x++){
        const dx=Math.abs(x+0.5-cx);
        if(dx>hw) continue;
        const edge=dx>hw-1,vv=(y-y0)/bh;
        let col=vv<0.25?lighten(base,0.5):base,a=edge?0.7:0.38;
        if(ph.sheen===2&&vv<0.35) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    for(let r=0;r<nR;r++){
      const ur=-0.72+1.44*r/Math.max(1,nR-1);
      for(let y=y0+2;y<y0+bh-2;y++){
        const x=cx+ur*half(y);
        const hue=(y*24+i*90+r*40)%360;
        const amp=0.5+0.5*Math.sin(y*0.8-i*Math.PI/2+r*0.6);
        put(g,x,y,tc(hsl2hex(hue,95,62)),0.3+0.65*amp);
      }
    }
    if(lobeL>0){
      for(let dy=0;dy<lobeL;dy++){
        const w=dy<lobeL-1?2:1;
        for(const s of [-1,1]) for(let k=0;k<w;k++) put(g,cx+s*bw*0.26+(s>0?k:-k-1),y0+bh+dy,tc(lighten(base,0.3)),0.65);
      }
    }
    const tcol=tc(mixHex(acc,'#ffffff',0.25));
    for(const s of [-1,1]){
      const sx=cx+s*bw*0.28,sy=y0+bh*0.8;
      for(let j=1;j<=TL;j++){
        const off=s*j*0.1+Math.sin(p*TWO_PI+j*0.5+(s>0?1:0))*1.0*(0.3+0.7*j/TL);
        const x=sx+off,y=sy+j;
        put(g,x,y,tcol,j>TL*0.8?0.35:0.75);
        if(j%3===0){put(g,x+1,y,tcol,0.5);put(g,x-1,y+1,tcol,0.4);}
      }
    }
    jOutline(g,cells,rgba(tc(lighten(base,0.2)),0.6));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

/* Immortal jelly: tiny thimble with a bright red middle and a fuzzy ring of tentacles */
function jbTiny(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail,at=ph.fin;
  const TL=Math.max(2,Math.round(BH*[0.5,0.75,0.6,0.7,1.0][tt]));
  const AL=[0,2,3,4][at];
  const W=Math.round(BW*1.5)+6,Hc=BH+TL+AL+8;
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1.04-0.18*c),bh=BH*(0.92+0.16*c);
    const g=emptyGrid(W,Hc),cx=W/2,y0=2,cells=new Set(),rim=[];
    for(let x=0;x<W;x++){
      const u=(x+0.5-cx)/(bw/2);
      if(Math.abs(u)>1) continue;
      const h=bh*Math.pow(1-u*u,0.4),yTop=y0+bh-h,yBot=y0+bh;
      rim.push(x);
      for(let y=Math.floor(yTop);y<=Math.floor(yBot);y++){
        const vv=(y-y0)/Math.max(bh,1),hs=hash2(x,y);
        let col=vv<0.3?lighten(base,0.6):base,a=vv<0.3?0.8:0.5;
        if(jPat(ph.pattern,x,y,cx,y0,bh,c,hs)){col=acc;a=0.8;}
        if(ph.sheen===2&&vv<0.35) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    const sw=bw>=9?1:0;
    for(let y=Math.round(y0+bh*0.35);y<=Math.round(y0+bh*0.9);y++){
      const lowrow=y>y0+bh*0.7;
      for(let x=Math.round(cx)-1-sw;x<=Math.round(cx)+sw;x++) put(g,x,y,tc(lowrow?darken(acc,0.2):acc),0.98);
    }
    const tcol=tc(lighten(acc,0.3));
    for(const x of rim){
      const len=Math.max(1,Math.round(TL*(0.6+0.4*((hash2(x,3)%100)/100))));
      for(let j=1;j<=len;j++) put(g,x+Math.sin(p*TWO_PI+j*0.8+x)*0.6,y0+bh+j,tcol,0.6);
    }
    for(let j=1;j<=AL;j++) put(g,cx+Math.sin(p*TWO_PI+j)*0.5,y0+bh+j,tc(acc),0.9);
    if(i===1) put(g,cx+bw*0.3,y0+1,'#ffffff',0.95);
    jOutline(g,cells,rgba(tc(darken(base,0.4)),0.85));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

/* Box jelly: cube-shaped bell with eyes on the sides and a bundle of tentacles at each corner */
function jbBox(f,stage,sick){
  const X=jctx(f,stage,sick),{ph,tc,base,acc,BW,BH}=X;
  const tt=ph.tail;
  const TL=Math.round(BH*[1.2,2.0,1.6,1.8,2.5][tt]);
  const W=BW+14,Hc=Math.round(BH*1.15)+TL+6;
  const frames=[];
  for(let i=0;i<4;i++){
    const p=i/4,c=0.5-0.5*Math.cos(p*TWO_PI);
    const bw=BW*(1.04-0.12*c),bh=BH*(0.94+0.1*c);
    const g=emptyGrid(W,Hc),cx=W/2,y0=2,cells=new Set();
    for(let y=y0;y<y0+bh;y++){
      const r=y-y0;
      const hw=bw/2-(r<2?(2-r)*0.9:0)-(r>bh-2?0.5:0);
      for(let x=Math.floor(cx-hw);x<Math.ceil(cx+hw);x++){
        const dx=Math.abs(x+0.5-cx);
        if(dx>hw) continue;
        const vv=r/Math.max(bh,1),hs=hash2(x,y);
        let col=vv<0.2?lighten(base,0.5):base,a=dx>hw-1.2?0.82:0.55;
        if(dx>hw-1.2) col=darken(base,0.15);
        if(jPat(ph.pattern,x,y,cx,y0,bh,c,hs)){col=acc;a=0.9;}
        if(ph.sheen===2&&vv<0.35) col=mixHex(col,'#ffffff',0.6);
        put(g,x,y,tc(col),a);cells.add(y*1000+x);
      }
    }
    const sy=Math.round(y0+bh*0.8);
    for(let x=Math.round(cx-bw/2+2);x<Math.round(cx+bw/2-2);x++) put(g,x,sy,tc(mixHex(acc,base,0.5)),0.85);
    const ey=Math.round(y0+bh*0.5);
    for(const ex of [cx-bw/2+1.5,cx+bw/2-1.5]){put(g,ex,ey,'#1b2a44',0.95);put(g,ex,ey-1,'#cfe9ff',0.8);}
    const tcol=tc(acc);
    const bundles=[[cx-bw/2+1,1],[cx+bw/2-2,1],[cx-bw*0.18,0.6],[cx+bw*0.18,0.6]];
    bundles.forEach(([bx,m],k)=>{
      const len=Math.round(TL*m*(0.85+0.15*((hash2(k,2)%100)/100)));
      const by=y0+bh;
      for(let j=0;j<=len;j++){
        const off=Math.sin(p*TWO_PI+j*0.5+k)*0.8*(j/Math.max(1,len));
        const a=j>len*0.8?0.4:0.8;
        put(g,bx+off,by+j,tcol,a);
        if(m===1&&j<len*0.8) put(g,bx+off+1,by+j,tcol,a*0.7);
      }
    });
    jOutline(g,cells,rgba(tc(darken(base,0.5)),0.9));
    frames.push(gridToCanvas(g,W,Hc));
  }
  return jFinish(frames,X);
}

const JB={saucer:jbSaucer,nettle:jbNettle,rosette:jbRosette,comb:jbComb,tiny:jbTiny,box:jbBox};
function buildJelly(f,stage,sick){
  const fn=JB[spriteSpec(f).jshape]||jbSaucer;
  return fn(f,stage,sick);
}
/* ================= juice: particles, ripples, polish ================= */
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
Object.assign(scene,{parts:[],ripples:[],snow:[],vw:null,va:null,wipe:null,swirl:null,rinse:null,pileN:null});
const CONFETTI=['#ff6b8b','#ffd166','#7ee08a','#6fd3ff','#c79bff','#ffffff'];
const jrnd=(a,b)=>a+Math.random()*(b-a);

function addPart(p){
  if(scene.parts.length>220) scene.parts.shift();
  p.t=0;p.life=p.life||0.8;scene.parts.push(p);
}
function burst(kind,x,y,o){
  if(REDUCED) return;
  o=o||{};
  const n=o.n;
  if(kind==='confetti'){
    for(let i=0,m=n||22;i<m;i++) addPart({x:x+jrnd(-3,3),y:y+jrnd(-3,3),vx:jrnd(-48,48),vy:jrnd(-80,-26),g:95,life:jrnd(0.9,1.7),col:CONFETTI[i%CONFETTI.length],sz:Math.random()<0.4?2:1,sw:jrnd(0,6.28)});
  }else if(kind==='sparkle'){
    const cols=o.cols||['#fff6b0','#ffffff','#ffe27a'];
    for(let i=0,m=n||8;i<m;i++){
      const a=Math.random()*6.283,sp=jrnd(8,26);
      addPart({x:x+Math.cos(a)*3,y:y+Math.sin(a)*3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,g:0,drag:2.2,life:jrnd(0.55,1.1),col:cols[i%cols.length],shape:'plus'});
    }
  }else if(kind==='heal'){
    for(let i=0,m=n||10;i<m;i++) addPart({x:x+jrnd(-8,8),y:y+jrnd(-2,6),vx:jrnd(-4,4),vy:jrnd(-26,-12),g:-4,life:jrnd(0.9,1.5),col:i%2?'#7ee08a':'#c9ffd0',shape:'plus'});
  }else if(kind==='plunge'){
    for(let i=0,m=n||2;i<m;i++) addPart({x:x+jrnd(-1,1),y:y,vx:jrnd(-4,4),vy:jrnd(8,22),g:-26,life:jrnd(0.4,0.8),col:'#e6f6ff'});
  }else if(kind==='crumbs'){
    for(let i=0,m=n||3;i<m;i++) addPart({x,y,vx:jrnd(-12,12),vy:jrnd(-10,4),g:14,life:jrnd(0.35,0.7),col:i%2?'#e8a04a':'#c98a3a'});
  }else if(kind==='sand'){
    const th=THEMES.find(q=>q.id===S.theme)||THEMES[0],col=lighten(th.sand,0.15);
    for(let i=0,m=n||4;i<m;i++) addPart({x:x+jrnd(-2,2),y,vx:jrnd(-16,16),vy:jrnd(-18,-5),g:55,life:jrnd(0.3,0.55),col});
  }else if(kind==='foam'){
    for(let i=0,m=n||2;i<m;i++) addPart({x:x+jrnd(-3,3),y:y+jrnd(-5,5),vx:jrnd(-8,8),vy:jrnd(-10,2),g:-3,life:jrnd(0.4,0.85),col:i%3?'#f2fbff':'#bfe9ff'});
  }
}
function ripple(x,y,max,o){
  if(REDUCED) return;
  o=o||{};
  if(scene.ripples.length>14) scene.ripples.shift();
  scene.ripples.push({x,y,t:0,dur:o.dur||0.9,max:max||12,ry:o.ry||0.45,col:o.col||'255,255,255'});
}
function initSnow(){
  scene.snow=[];
  for(let i=0;i<30;i++) scene.snow.push({x:jrnd(0,SW),y:jrnd(0,SAND_Y),vy:jrnd(1.5,4.5),ph:jrnd(0,6.28),a:jrnd(0.18,0.45)});
}

/* ----- one-shot effects the UI triggers ----- */
function scrubFx(){
  scene.wipe={t:0,dur:0.9,x:-8,y:20,from:(scene.va==null?S.algae:scene.va)};
}
function swirlFx(){
  scene.swirl={t:0,dur:1.5};
  for(let i=0;i<3;i++) ripple(jrnd(30,130),2,jrnd(12,20),{ry:0.25,dur:jrnd(0.7,1.1)});
}
function rinseFx(){scene.rinse={t:0,dur:0.95};}
function healFx(id){
  const r=scene.rt.get(id);if(!r) return;
  burst('heal',r.x,r.y,{n:12});ripple(r.x,r.y,10,{col:'126,224,138'});r.sq=0.4;
}
function waterTap(x,y){
  audioResume();
  if(y>SAND_Y+1){burst('sand',x,y,{n:5});}
  else ripple(x,y,15,{ry:0.5});
  sfx.tink();
  for(const f of S.fish){
    const r=scene.rt.get(f.id);if(!r||r.sleep||f.sick) continue;
    const kind=kindOf(f);
    if(kind==='shrimp'||(kind==='jelly'&&!SP[f.sp].glide)) continue;
    const d=Math.hypot(r.x-x,r.y-y);
    if(f.trait==='shy'){
      if(d<48){r.flee=0.9;r.wait=0;r.tx=clamp(r.x+(r.x-x)*3,8,152);r.ty=clamp(r.y+(r.y-y)*3,12,SAND_Y-10);}
    }else if(d<95&&(f.trait==='bold'||f.trait==='greedy'||f.trait==='social'||f.trait==='playful'||Math.random()<0.3)){
      r.tx=x;r.ty=clamp(y,10,SAND_Y-8);r.wait=0;r.chase=0;
    }
  }
}

/* ----- celebration events queued by the sim ----- */
let jfxAt=0;
function jsfx(name){
  const n=performance.now();
  if(n-jfxAt<160) return;
  jfxAt=n;if(sfx[name]) sfx[name]();
}
function fireJuice(e,r){
  const x=r.x,y=r.y;
  switch(e.kind){
    case 'hatch': burst('confetti',x,y,{n:12});burst('sparkle',x,y,{n:5});ripple(x,y,10);break;
    case 'grow': burst('sparkle',x,y,{n:10});ripple(x,y,13);r.sq=0.45;jsfx('levelup');break;
    case 'species': case 'hyb': case 'rare':
      burst('confetti',x,y,{n:34});burst('sparkle',x,y,{n:12});ripple(x,y,20);ripple(x,y,11,{dur:0.65});r.sq=0.45;jsfx('discover');break;
    case 'gene': burst('sparkle',x,y,{n:9});ripple(x,y,12);jsfx('sparkle');break;
    case 'arrive': burst('sparkle',x,y,{n:10});burst('plunge',x,y-6,{n:4});ripple(x,y,16);r.sq=0.45;break;
    case 'heal': burst('heal',x,y,{n:12});ripple(x,y,10,{col:'126,224,138'});r.sq=0.4;break;
    case 'love': for(let i=0;i<3;i++) addFx('heart',x+jrnd(-6,6),y-4-i*3);break;
  }
}
function handleJuice(){
  const now=performance.now();
  for(let i=JUICE_Q.length-1;i>=0;i--){
    const e=JUICE_Q[i];
    if(!e.fxDone){
      const r=e.id!=null?scene.rt.get(e.id):null;
      if(r){fireJuice(e,r);e.fxDone=true;}
      else if(e.id==null||now-e.t0>3000) e.fxDone=true;
    }
    if(e.fxDone&&(e.uiDone||!e.msg||now-e.t0>6000)) JUICE_Q.splice(i,1);
  }
}

/* ----- per-frame update ----- */
function updateJuice(dt){
  if(!S) return;
  /* particles */
  for(let i=scene.parts.length-1;i>=0;i--){
    const p=scene.parts[i];
    p.t+=dt;
    if(p.t>=p.life){scene.parts.splice(i,1);continue;}
    if(p.g) p.vy+=p.g*dt;
    if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}
    p.x+=p.vx*dt+(p.sw!=null?Math.sin(p.t*11+p.sw)*0.35:0);p.y+=p.vy*dt;
  }
  for(let i=scene.ripples.length-1;i>=0;i--){const e=scene.ripples[i];e.t+=dt;if(e.t>=e.dur) scene.ripples.splice(i,1);}
  /* marine snow */
  if(!scene.snow.length) initSnow();
  for(const s of scene.snow){
    s.y+=s.vy*dt;s.x+=Math.sin(scene.t*0.8+s.ph)*4*dt;
    if(s.y>SAND_Y-1){s.y=0;s.x=jrnd(0,SW);}
    if(s.x<0) s.x+=SW;else if(s.x>=SW) s.x-=SW;
  }
  /* eased murk + algae so cleaning fades instead of snapping */
  const ease=(cur,tgt,up,dn)=>{
    if(Math.abs(tgt-cur)<0.08) return tgt;
    return cur+(tgt-cur)*(1-Math.exp(-(tgt>cur?up:dn)*dt));
  };
  if(scene.vw==null||REDUCED){scene.vw=S.waste;}else scene.vw=ease(scene.vw,S.waste,2,2.4);
  if(scene.va==null||REDUCED){scene.va=S.algae;}else if(!scene.wipe) scene.va=ease(scene.va,S.algae,3,4);
  /* scrub wipe */
  const w=scene.wipe;
  if(w){
    w.t+=dt;
    const k=Math.min(1,w.t/w.dur),e=k*k*(3-2*k);
    w.x=-8+(SW+16)*e;
    w.y=14+(SAND_Y-32)*(0.5+0.5*Math.sin(w.t*13));
    scene.va=w.from;
    if(!REDUCED){
      if(Math.random()<dt*70) burst('foam',w.x,w.y,{n:1});
      if(Math.random()<dt*34) addPart({x:jrnd(0,Math.max(1,w.x)),y:jrnd(8,SAND_Y-6),vx:0,vy:0,life:0.5,col:'#ffffff',shape:'plus'});
    }
    if(k>=1){scene.wipe=null;scene.va=S.algae;}
  }
  /* water change swirl */
  const sw=scene.swirl;
  if(sw){
    sw.t+=dt;
    if(sw.t<0.55&&!REDUCED&&Math.random()<dt*50) burst('plunge',jrnd(30,130),2,{n:1});
    if(sw.t>=sw.dur) scene.swirl=null;
  }
  /* filter rinse */
  const rn=scene.rinse;
  if(rn){
    rn.t+=dt;
    if(rn.t>=rn.dur) scene.rinse=null;
    else if(!REDUCED){
      if(Math.random()<dt*45) scene.bubbles.push({x:jrnd(142,154),y:jrnd(SAND_Y-26,SAND_Y-3),vy:jrnd(22,40),s:Math.random()<0.35?2:1});
      if(rn.t<0.6&&Math.random()<dt*34) addPart({x:jrnd(142,154),y:jrnd(SAND_Y-26,SAND_Y-4),vx:jrnd(-10,-2),vy:jrnd(4,12),g:0,life:jrnd(0.5,0.9),col:'#8a7a45'});
    }
  }
  /* a new coin lands on the pile */
  const pn=Math.min(14,Math.floor(S.pile));
  if(scene.pileN==null) scene.pileN=pn;
  if(pn>scene.pileN) burst('sparkle',147,SAND_Y+8,{n:3,cols:['#fff1a8','#ffffff']});
  scene.pileN=pn;
  handleJuice();
}

/* ----- drawing helpers ----- */
function drawAmbientBack(c,t,light){
  /* surface glimmer */
  if(!REDUCED){
    for(let x=0;x<SW;x+=3){
      const a=0.05+0.1*Math.max(0,Math.sin(t*1.6+x*0.28))*(0.5+0.5*light);
      c.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
      c.fillRect(x,0,3,1);
      if(Math.sin(t*1.1+x*0.5)>0.6) c.fillRect(x+1,1,2,1);
    }
    /* drifting marine snow */
    for(const s of scene.snow){
      c.fillStyle='rgba(235,248,255,'+(s.a*(0.5+0.5*light)).toFixed(3)+')';
      c.fillRect(Math.round(s.x),Math.round(s.y),1,1);
    }
    /* sand glints */
    for(let i=0;i<9;i++){
      const v=Math.sin(t*2.1+i*1.9);
      if(v<0.8) continue;
      const x=hash2(i,31)%SW,y=SAND_Y+1+hash2(i,32)%12;
      c.fillStyle=v>0.95?'rgba(255,255,255,.95)':'rgba(255,255,255,.6)';
      c.fillRect(x,y,1,1);
      if(v>0.95){c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3);}
    }
  }
}
function drawRipples(c){
  for(const e of scene.ripples){
    const k=e.t/e.dur,rr=e.max*(1-Math.pow(1-k,2));
    if(rr<1) continue;
    c.fillStyle='rgba('+e.col+','+((1-k)*0.7).toFixed(2)+')';
    const steps=Math.max(10,Math.round(rr*2.6));
    for(let i=0;i<steps;i++){
      const th=i/steps*6.2832;
      c.fillRect(Math.round(e.x+Math.cos(th)*rr),Math.round(e.y+Math.sin(th)*rr*e.ry),1,1);
    }
  }
}
function drawMurk(c){
  if(scene.vw>25){c.fillStyle='rgba(120,105,50,'+(clamp((scene.vw-25)/75,0,1)*0.45).toFixed(3)+')';c.fillRect(0,0,SW,SH);}
}
function drawAlgae(c){
  const va=scene.va;
  if(va<=8) return;
  const a=va/100,bx=scene.wipe?Math.round(scene.wipe.x):-1;
  c.fillStyle='rgba(60,150,60,'+(a*0.22).toFixed(3)+')';
  const x0=Math.max(0,bx);
  c.fillRect(x0,0,SW-x0,SH);
  const n=Math.round(a*70);
  for(let i=0;i<n;i++){
    const h=hash2(i,5),side=h%3;
    const gx=side===0?(h>>4)%10:(side===1?SW-1-(h>>4)%10:(h>>4)%SW);
    if(gx<bx) continue;
    const gy=(hash2(i,9)%(SAND_Y-4))+2;
    R(c,i%3?'#3d9a3f':'#56b850',gx,gy,1+(h>>9)%2,1+(h>>11)%2);
  }
}
function drawWipe(c){
  const w=scene.wipe;if(!w) return;
  /* soapy band along the sponge's edge */
  c.fillStyle='rgba(235,252,255,.35)';c.fillRect(Math.round(w.x)-2,0,2,SAND_Y);
  /* the sponge */
  const sx=Math.round(w.x)-5,sy=Math.round(w.y)-4;
  R(c,'#b9892a',sx,sy+7,10,1);
  R(c,'#f2d36b',sx,sy,10,7);R(c,'#ffe58f',sx,sy,10,1);
  R(c,'#d6b34a',sx+2,sy+2,2,2);R(c,'#d6b34a',sx+6,sy+4,2,2);R(c,'#d6b34a',sx+7,sy+1,1,1);
}
function drawSwirl(c){
  const w=scene.swirl;if(!w) return;
  const k=w.t/w.dur;
  const front=Math.min(SAND_Y,SAND_Y*Math.min(1,w.t/0.55));
  c.fillStyle='rgba(170,235,255,'+(0.26*(1-k)).toFixed(3)+')';
  c.fillRect(0,0,SW,Math.round(front));
  if(w.t<0.55){c.fillStyle='rgba(235,252,255,.7)';c.fillRect(0,Math.round(front),SW,1);}
  const fade=1-k,grow=0.4+0.6*Math.min(1,w.t/0.5);
  for(let i=0;i<26;i++){
    const u=i/26,ang=w.t*6.5+u*9.4,rr=(6+u*52)*grow;
    const x=80+Math.cos(ang)*rr*1.45,y=54+Math.sin(ang)*rr*0.55;
    c.fillStyle='rgba(255,255,255,'+(fade*(0.35+0.4*u)).toFixed(2)+')';
    const sz=u>0.6?2:1;
    c.fillRect(Math.round(x),Math.round(y),sz,sz);
  }
}
function drawParts(c){
  for(const p of scene.parts){
    const k=p.t/p.life;
    c.globalAlpha=k<0.6?1:Math.max(0,1-(k-0.6)/0.4);
    c.fillStyle=p.col;
    const x=Math.round(p.x),y=Math.round(p.y);
    if(p.shape==='plus'&&k<0.65){c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3);}
    else{const z=p.sz||1;c.fillRect(x,y,z,z);}
  }
  c.globalAlpha=1;
}

/* ---------- juice: coins, floaters, pops ---------- */
const coinView={shown:null,target:null,hold:0,raf:0};
function setCoinText(v){coinView.shown=v;$('#coins').textContent=Math.round(v);}
function bumpCoins(){
  if(REDUCED) return;
  const el=$('.coins');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
function floatText(txt,x,y,cls){
  if(REDUCED) return;
  const el=document.createElement('div');
  el.className='floatnum '+(cls||'up');el.textContent=txt;
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function coinAnchor(){const r=$('.coins').getBoundingClientRect();return [r.left+r.width/2,r.bottom+2];}
function snapCoins(){
  cancelAnimationFrame(coinView.raf);
  coinView.hold=0;coinView.shown=null;coinView.target=null;
  renderCoins();
}
/* the counter eases to whatever S.coins is, unless coins are mid-flight */
function renderCoins(){
  if(!S||coinView.hold>0) return;
  const to=S.coins;
  if(coinView.shown===null||REDUCED||document.hidden){
    cancelAnimationFrame(coinView.raf);coinView.target=to;setCoinText(to);return;
  }
  if(coinView.target===to) return;
  const from=coinView.shown,d=to-from;
  coinView.target=to;
  cancelAnimationFrame(coinView.raf);
  if(Math.abs(d)<1){setCoinText(to);return;}
  const a=coinAnchor();
  floatText((d>0?'+':'\u2212')+Math.round(Math.abs(d)),a[0],a[1],d>0?'up':'dn');
  bumpCoins();
  const t0=performance.now(),dur=clamp(260+Math.abs(d)*3,320,800);
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    setCoinText(from+d*e);
    if(k<1) coinView.raf=requestAnimationFrame(step);
  };
  coinView.raf=requestAnimationFrame(step);
}
/* n coins were just added to S.coins; the counter still shows `base`. Fly them in one by one. */
function flyCoins(n,ox,oy,base){
  const tgt=$('.coins').getBoundingClientRect();
  if(REDUCED||document.hidden||!tgt.width||!Element.prototype.animate){renderCoins();return;}
  const cnt=Math.min(n,clamp(Math.round(Math.sqrt(n)*2.2),3,14));
  cancelAnimationFrame(coinView.raf);
  coinView.hold++;coinView.target=null;setCoinText(base);
  const icon=$('#coinIc').getBoundingClientRect();
  const tx=icon.left+icon.width/2,ty=icon.top+icon.height/2,share=n/cnt;
  let landed=0,released=false;
  const release=()=>{
    if(released) return;released=true;
    coinView.hold=Math.max(0,coinView.hold-1);
    if(coinView.hold===0){
      const a=coinAnchor();floatText('+'+n,a[0],a[1],'up');
      coinView.target=null;renderCoins();
    }
  };
  setTimeout(release,2600);
  for(let i=0;i<cnt;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='flycoin';el.innerHTML=ic('coin',2);
      document.body.appendChild(el);
      const w=el.offsetWidth||14,h=el.offsetHeight||14;
      const sx=ox-w/2,sy=oy-h/2,ex=tx-w/2,ey=ty-h/2;
      const mx=sx+jrnd(-34,34),my=sy-jrnd(16,46);
      const anim=el.animate([
        {transform:`translate(${sx}px,${sy}px) scale(.5)`,opacity:0.2,easing:'cubic-bezier(.2,.8,.3,1)',offset:0},
        {transform:`translate(${mx}px,${my}px) scale(1.15)`,opacity:1,easing:'cubic-bezier(.55,0,.9,.6)',offset:0.3},
        {transform:`translate(${ex}px,${ey}px) scale(.7)`,opacity:1,offset:1}
      ],{duration:jrnd(640,820),fill:'forwards'});
      anim.onfinish=()=>{
        el.remove();landed++;
        if(!released){setCoinText((coinView.shown||0)+share);sfx.ping(i);bumpCoins();}
        if(landed===cnt) release();
      };
    },i*55);
  }
}
function pileOrigin(){
  const cv=scene.cv.getBoundingClientRect();
  const x=cv.left+147/SW*cv.width,y=cv.top+(SAND_Y+8)/SH*cv.height;

function hintText(){
  const sick=S.fish.filter(f=>f.sick);
  if(sick.length) return `${names(sick)} ${sick.length>1?'are':'is'} sick. Give medicine and keep the water clean.`;
  const hungry=S.fish.filter(f=>f.hunger<35);
  if(hungry.length) return `${names(hungry)} ${hungry.length>1?'look':'looks'} hungry. Tap Feed.`;
  if(S.fish.some(f=>SP[f.sp].sens)&&S.waste>32) return 'Jellyfish are picky about clean water. Change some water soon.';
  if(S.waste>60) return 'The water is getting murky. Change some water.';
  if(S.filter<20) return 'The filter is clogged. Rinse it.';
  if(S.algae>60) return 'Algae is covering the glass. Give it a scrub.';
  const chilling=S.polyps.filter(p=>p.chill>0&&p.size>=2);
  if(chilling.length){
    const best=Math.max(...chilling.map(p=>p.chill));
    return `Your polyps are cooling down, ${pctW(100*best/POLYP_CHILL_MIN)}% of the way. Warm the tank back up once baby jellies appear.`;
  }
  const off=S.fish.filter(f=>tempOff(f)>0.5);
  if(off.length) return `${off[0].name}${off.length>1?' and others are':' is'} not comfy at ${S.temp.toFixed(0)}°C. Try a different heater setting.`;
  const ready=S.eggs.filter(e=>e.t<=0);
  if(ready.length){
    return ready[0].kids.every(k=>viaPolyp(k.sp))?'Larvae are ready to settle, but the polyp bed is full.':'Eggs are ready to hatch, but the tank is full. Make room.';
  }
  if(S.pile>=1) return `${Math.floor(S.pile)} ${plural(Math.floor(S.pile),'coin is','coins are')} waiting. Tap the pile or Collect.`;
  if(!S.fish.length) return 'Your tank is empty. Visit the shop to get your first fish.';
  if(S.polyps.some(p=>p.size>=2)) return 'Your polyps are ready. Open one on the Crew tab to see how to wake them.';
  const inc=S.fish.reduce((a,f)=>a+incomePerHour(f),0);
  return `All calm. Your crew earns about ${Math.round(inc)} coins an hour.`;
}

function eggHtml(e){

  const where=nL&&nE?'Ready, waiting for room.':(nL?'Ready to settle, waiting for room in the polyp bed.':'Ready to hatch, waiting for room in the tank.');
  const when=nL&&!nE?'Settles as a polyp in ':'Hatches in ';
  const status=ready?where:when+fmtDur(e.t);
  return `<div class="card egg"><div class="row2"><b>${title}</b><span class="hint">${e.parents[0]} × ${e.parents[1]}</span></div>

function htmlBreed(){
  let a=selFish(breedSel.a),b=selFish(breedSel.b);
  if(!a) breedSel.a=null; if(!b) breedSel.b=null;
  const slot=(f,which)=>`<div class="card slot" >${f?`<button class="fcard" style="width:100%" data-act="pick-slot" data-which="${which}"><div class="pic"><canvas data-fish="${f.id}" width="64" height="54"></canvas></div><div class="nm">${f.name}</div><div class="sub">${speciesLabel(f)}</div></button>`:`<button class="btn" data-act="pick-slot" data-which="${which}" style="width:100%;min-height:120px">${ic('plus',3)}Pick ${which==='a'?'first':'second'}</button>`}</div>`;
  const block=pairBlock(a,b);
  const kind=a?kindOf(a):(b?kindOf(b):'fish');
  const same=a&&b&&kindOf(a)===kindOf(b),mixed=same&&a.sp!==b.sp;
  let pred='';
  if(same){
    const larvae=kind==='jelly'&&viaPolyp(a.sp)&&viaPolyp(b.sp);
    pred=`<div class="card pred"><h2 class="sec-title" style="margin:0">Likely ${larvae?'larvae':'offspring'}</h2>`+
      (mixed?`<div class="r"><span>Species</span><div class="chips"><span class="chip rare dom">${shortName(a.sp)} 50%</span><span class="chip rare dom">${shortName(b.sp)} 50%</span></div></div>`:'')+
      lociOf(kind).map(k=>{
        const rows=predictLocus(k,a,b);
        if(k==='sheen'&&rows.length===1&&rows[0].label==='None') return '';
        return `<div class="r"><span>${LD(kind,k).label}</span><div class="chips">${rows.map(p=>`<span class="chip ${p.rare?'rare dom':''}">${p.sw?`<i class="sw" style="background:${p.sw}"></i>`:''}${p.label} ${Math.round(p.p*100)}%</span>`).join('')}</div></div>`;
      }).join('')+

  }
  const eggs=S.eggs.map(eggHtml).join('');
  const how=[];
  if(!a&&!b) how.push('Fish lay eggs. Shrimp carry theirs. Most jellies make larvae that settle as polyps. Different species of the same kind can cross.');
  else{
    if(kind==='jelly'&&a&&SP[a.sp].direct) how.push('Comb jellies skip the polyp stage. Their eggs hatch straight into tiny comb jellies.');

    else if(kind==='shrimp') how.push('One of the pair carries the eggs until they hatch.');
    else how.push('Eggs hatch into fry that grow up in the tank.');
    if(mixed) how.push('Mixed pairs make hybrids. They are sterile, but worth more and get their own Book page.');
  }
  how.push(`Only adults can breed, and parents rest for ${fmtDur(COOLDOWN_MIN)} afterwards.`);
  return `<h2 class="sec-title">Pick a pair</h2>
    <div class="pair">${slot(a,'a')}${slot(b,'b')}</div>

}

/* ---------- DNA view: one rung per trait. What shows is on the left of the rung, what hides is dim on the right ---------- */
const HX={R:44,W:60,A:18,P:3,PAD:10,TURN:5}; // row height, helix width, strand swing, pixel size, end padding, rows per full twist
const HX_SHOW='#ffb347',HX_SHEEN=['#8fa9be','#fff3a0','#f4f0ff'];
let hxRows=null,hxPhase=0.6,hxRaf=0,hxLast=0;
/* one trait for the player: what shows, and any gene it carries without showing */
function geneInfo(f,k){
  const L=LD(kindOf(f),k),pair=f.g[k],o=L.opts,isCol=k==='color'||k==='accent';
  const gene=i=>({n:o[i].n,c:isCol?o[i].c:(k==='sheen'?HX_SHEEN[i]:HX_SHOW),sw:isCol?o[i].c:null,rare:!!o[i].r});
  if(k==='size') return {label:L.label,shown:{n:SIZE_NAMES[pair[0]+pair[1]],c:HX_SHOW,sw:null,rare:false},hidden:[],note:pair[0]!==pair[1]?o[pair[0]].n+' + '+o[pair[1]].n:''};
  const v=k==='sheen'?((pair[0]===pair[1]&&pair[0]>0)?pair[0]:0):expr(k,pair);
  return {label:L.label,shown:gene(v),hidden:pair.filter(i=>i!==v).map(gene),note:''};
}
/* the helix itself, drawn as chunky pixels. phase turns it. */
function helixInner(rows,phase){
  const {R,W,A,P,PAD,TURN}=HX,H=rows.length*R+PAD*2,cx=W/2;
  const th=y=>(y-PAD)/(R*TURN)*Math.PI*2+phase;
  const snap=v=>Math.round(v/P)*P;
  const px=(x,y,w,h,cls,extra)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${cls?`class="${cls}"`:''} ${extra||''}/>`;
  let back='',front='';
  for(let y=0;y<H;y+=P){
    const t=th(y+P/2),c=Math.cos(t)*A,aFront=Math.sin(t)>0;
    const xa=snap(cx+c)-P,xb=snap(cx-c)-P;
    front+=px(aFront?xa:xb,y,P*2,P,'hx-f');
    back+=px(aFront?xb:xa,y,P*2,P,'hx-b');
  }
  let rungs='',pads='';
  rows.forEach((r,i)=>{
    const y=snap(PAD+i*R+R/2),half=Math.max(P*3,Math.abs(Math.cos(th(y)))*A);
    const xl=snap(cx-half),xr=snap(cx+half);
    const sides=[{g:r.shown,dim:false},r.hidden.length?{g:r.hidden[0],dim:true}:{g:r.shown,dim:false}];
    sides.forEach((s,side)=>{
      const glint=s.g.rare?0.8+0.2*Math.sin(phase*4+i):1;
      const op=((s.dim)?0.4:1)*glint;
      const x0=side?cx:xl,w=side?xr-cx:cx-xl,xe=side?xr:xl;
      rungs+=px(x0,y-P,w,P*2,'',`fill="${s.g.c}" opacity="${op.toFixed(2)}"`);
      pads+=px(xe-P,y-P*2,P*2,P*4,'',`fill="${s.g.c}" opacity="${op.toFixed(2)}"`);
    });
  });
  return back+rungs+front+pads;
}
function geneBlock(f){
  const rows=lociOf(kindOf(f)).map(k=>geneInfo(f,k));
  hxRows=rows;
  const {W,R,PAD}=HX,H=rows.length*R+PAD*2;
  const sw=g=>g.sw?`<i class="sw" style="background:${g.sw}"></i>`:'';
  const body=rows.map(r=>{
    const s=r.shown;
    const hid=r.hidden.length?`<span class="hx-hid${r.hidden.some(g=>g.rare)?' rare':''}">carries ${r.hidden.map(g=>sw(g)+g.n).join(' + ')}</span>`:(r.note?`<span class="hx-hid">${r.note}</span>`:'');
    return `<div class="hx-row"><span class="hx-k">${r.label}</span><span class="hx-v"><b${s.rare?' class="rare"':''}>${sw(s)}${s.n}${s.rare?'<small>rare</small>':''}</b>${hid}</span></div>`;
  }).join('');
  return `<div class="kv"><h2 class="sec-title" style="margin:0">Genes</h2>
      <p class="hint">Each trait has two genes. One shows. The other can hide, and babies can still get it.</p>
      <div class="helix"><svg class="hx-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" shape-rendering="crispEdges" aria-hidden="true">${helixInner(rows,hxPhase)}</svg>${body}</div></div>`;
}

function sheetPolyp(p){
  const cold=coldOf(p),pct=pctW(100*p.chill/POLYP_CHILL_MIN),grown=p.size>=2;
  const cooled=S.temp<=cold+0.2;
  let status;
  if(S.waste>=60) status='The water is too dirty for the colony to grow. Change some water.';
  else if(!grown) status=`Still growing. It needs a colony size of 2 before it can bud (${p.size.toFixed(1)} now).`;
  else if(cooled) status=`Cold enough. Keep it cool for ${fmtDur(Math.max(0,POLYP_CHILL_MIN-p.chill))} more and baby jellies will bud off.`;

/* ---------- backup code: move or rescue your tank as plain text ---------- */
const bkEsc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const bkBad=m=>{const e=new Error(m);e.userMsg=m;return e;};
function bkB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function bkUnB64(str){const s=atob(str),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);return u;}
async function makeBackupCode(){
  const bytes=new TextEncoder().encode(serialize());
  if(typeof CompressionStream!=='undefined'){
    try{
      const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();
      w.write(bytes);w.close();
      return 'FIN1z:'+bkB64(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    }catch(e){}
  }
  return 'FIN1:'+bkB64(bytes);
}
async function readBackupCode(text){
  const m=/^FIN1(z?):([A-Za-z0-9+/=]+)$/.exec(String(text||'').replace(/\s+/g,''));
  if(!m) throw bkBad('That does not look like a Finlings backup code.');
  let bytes;
  try{bytes=bkUnB64(m[2]);}catch(e){throw bkBad('The code is damaged. Check that you copied all of it.');}
  if(m[1]==='z'){
    if(typeof DecompressionStream==='undefined') throw bkBad('This browser cannot open that code.');
    const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
    w.write(bytes);w.close();
    bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  let o;
  try{o=JSON.parse(new TextDecoder().decode(bytes));}catch(e){throw bkBad('The code is damaged. Check that you copied all of it.');}
  if(!o||!Array.isArray(o.fish)) throw bkBad('That code is not from Finlings.');
  return o;
}
function prepareBackup(){
  makeBackupCode().then(c=>{if(sheetState&&sheetState.kind==='settings') sheetState.code=c;}).catch(()=>{});
}
function backupHtml(){
  const b=sheetState;
  return `<div class="kv"><h2 class="sec-title" style="margin:0">Backup</h2>
    <p class="hint">Your tank is stored on this device. A backup code lets you move it to another device, or get it back if the app is ever wiped. Keep it in Notes or email it to yourself.</p>
    <div class="actions"><button class="btn" data-act="backup-copy">Copy backup code</button><button class="btn ${b.restore?'primary':''}" data-act="backup-restore-open">Restore from code</button></div>
    ${b.showCode&&b.code?`<textarea class="codebox" readonly rows="4" onfocus="this.select()" aria-label="Your backup code">${bkEsc(b.code)}</textarea>`:''}
    ${b.restore?`<textarea class="codebox" id="restoreBox" rows="4" placeholder="Paste your backup code here" aria-label="Paste a backup code">${bkEsc(b.restoreText||'')}</textarea>
    <button class="btn ${b.pending?'danger':'primary'}" data-act="backup-restore-go">${b.pending?'Tap again to replace this tank':'Restore this tank'}</button>`:''}
    ${b.msg?`<p class="hint">${bkEsc(b.msg)}</p>`:''}</div>`;
}
function backupCopy(){
  const st=sheetState;if(!st) return;
  const shown=ok=>{
    if(sheetState!==st) return;
    st.showCode=true;
    st.msg=ok?'Copied. Paste it somewhere safe, like Notes.':'Tap the box, then copy the code and keep it somewhere safe.';
    renderSheet(true);
  };
  const go=code=>{
    st.code=code;
    let p=null;
    try{p=navigator.clipboard.writeText(code);}catch(e){}
    if(p&&p.then) p.then(()=>shown(true),()=>shown(false)); else shown(false);
  };
  if(st.code) go(st.code);
  else makeBackupCode().then(go).catch(()=>{toast('Could not make a backup code.');sfx.error();});
}
async function backupRestoreGo(){
  const st=sheetState;if(!st) return;
  if(st.pending){const o=st.pending;closeSheet();applyRestored(o);return;}
  try{
    const box=$('#restoreBox');
    st.restoreText=box?box.value:(st.restoreText||'');
    if(st.restoreText.length>3000000) throw bkBad('That code is too long to be a Finlings backup.');
    const o=await readBackupCode(st.restoreText);
    st.pending=o;
    st.msg=`Found a tank with ${o.fish.length} ${plural(o.fish.length,'creature')} and ${Math.floor(+o.coins||0)} coins. Restoring replaces the tank you have now.`;
  }catch(e){
    st.pending=null;
    st.msg=(e&&e.userMsg)||'That code did not work. Check that you pasted all of it.';
    sfx.error();
  }
  if(sheetState===st) renderSheet(true);
}
function applyRestored(o){

function breedToast(r,egg){

  else if(r.kind==='shrimp'){

function onAct(el){
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'tab': sfx.tab();setTab(el.dataset.tab);break;
    case 'collect': doCollect();break;
    case 'feed': if(!S.fish.length){toast('Nobody to feed yet.');sfx.error();shake(el);} else if(!feedFlakes()){toast('Plenty of food in there already.');sfx.error();shake(el);} else sfx.feed();break;
    case 'scrub': sfx.scrub();scrubFx();S.algae=0;toast('The glass is sparkling.');changed();break;
    case 'water': sfx.water();swirlFx();S.waste=Math.max(3,S.waste*0.12);toast('Fresh water in.');changed();break;
    case 'rinse': sfx.rinse();rinseFx();S.filter=100;toast('Filter rinsed.');changed();break;
    case 'heat-up': S.heater=clamp(S.heater+1,16,32);changed();break;
    case 'heat-dn': S.heater=clamp(S.heater-1,16,32);changed();break;
    case 'heat-set': {
      S.heater=clamp(+el.dataset.t,16,32);
      toast(`Heater set to ${S.heater}°C.`);
      changed();renderSheet(true);break;
    }
    case 'treat': {
      let n=0;
      for(const f of S.fish){if(f.sick&&S.meds>0){f.sick=false;f.health=70;S.meds--;n++;qJuice({kind:'heal',id:f.id});}}

    }

    case 'buy-med': if(S.coins<15) break;sfx.buy();S.coins-=15;S.meds++;toast('Medicine bought.');changed();renderTab('shop');break;

  sfx.chime();
  openSheet('away',{ev,label:`You were away for ${fmtDur(mins)}.`});
  if(curTab!=='tank') renderTab(curTab);
}

document.addEventListener('click',e=>{
  const sh=$('#sheet');
  if(e.target===sh){closeSheet();return;}
  const el=e.target.closest('[data-act]');
  if(el&&!el.disabled){
    audioResume();
    if(!OWN_SFX.has(el.dataset.act)) sfx.tap();
    onAct(el);
    popEl(el);
  }else{
    const b=e.target.closest('button');
    if(b&&!b.disabled) popEl(b);
  }
});
const OWN_SFX=new Set(['tab','feed','scrub','water','rinse','treat','treat-one','sell','breed-go','buy-fish','buy-decor','buy-tank','buy-filter','buy-feeder','refill','buy-med','buy-theme','collect','dev-tap']);
$('#btnSound').addEventListener('click',()=>{
  audioResume();
  S.sound=!S.sound;
  renderSoundBtn();
  if(S.sound) sfx.chime();
  markDirty();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetState) closeSheet();});
$('#decorBtn').addEventListener('click',()=>toggleDecor(!scene.decorMode));
$('#btnSettings').addEventListener('click',()=>openSheet('settings'));
/* ================= saving ================= */
const saveState={doc:null,status:'Saved on this device only.',busy:false,pending:false,allowed:false,timer:0};
let lastSimAt=Date.now();

function markDirty(){
  clearTimeout(saveState.timer);
  saveState.timer=setTimeout(saveNow,1500);
}
async function saveNow(){
  if(!S||!saveState.allowed) return;
  const json=serialize();
  try{localStorage.setItem(SAVE_KEY,json);}catch(e){}
  if(!saveState.doc) return;
  if(saveState.busy){saveState.pending=true;return;}
  saveState.busy=true;
  try{
    await saveState.doc.set({json,savedAt:S.savedAt});
    saveState.status='Saved to your account and this device.';
  }catch(e){
    saveState.status='Saved on this device. The account save did not go through.';
  }
  saveState.busy=false;
  if(saveState.pending){saveState.pending=false;saveNow();}
}

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return null;
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=res[0],user=res[1];
    if(!db||!user) return null;
    const id=await user.id();
    if(!id) return null;
    const doc=db.doc('data/users/'+id+'/tank');
    const snap=await doc.get();
    let data=null;
    if(snap.exists){
      const d=snap.data();
      if(d&&typeof d.json==='string'){try{data=JSON.parse(d.json);}catch(e){data=null;}}
    }
    return {doc,data};
  }catch(e){return null;}
}

/* ================= boot ================= */
function afterLoad(){
  JUICE_ON=false;
  const now=Date.now();
  let mins=(now-S.lastSeen)/60000;
  if(!(mins>0)) mins=0;
  if(mins>OFFLINE_CAP_MIN) mins=OFFLINE_CAP_MIN;
  lastSimAt=now;
  scene.rt.clear();scene.food.length=0;
  let ev=null;
  if(mins>0.05) ev=simulate(mins);
  S.lastSeen=now;
  buildNav();
  for(const f of S.fish) discover(f);
  JUICE_Q.length=0;JUICE_ON=true;
  scene.vw=scene.va=scene.pileN=null;
  snapCoins();
  setTab(curTab);
  refreshActive();
  if(ev&&mins>=5) showAway(mins,ev);
  else if(!S.seenWelcome){S.seenWelcome=true;S.news=NEWS_V;openSheet('welcome');}
  else if((S.news||0)<NEWS_V){const prev=S.news||0;S.news=NEWS_V;openSheet('news',prev);}
}
function tick(){
  if(!S) return;
  const now=Date.now();
  let mins=(now-lastSimAt)/60000;
  lastSimAt=now;
  if(!(mins>0)) return;
  if(mins>OFFLINE_CAP_MIN) mins=OFFLINE_CAP_MIN;
  const hatchedBefore=S.stats.hatched;
  const ev=simulate(mins);
  if(mins>=5) JUICE_Q.length=0;
  if(mins>=5&&!sheetState) showAway(mins,ev);
  else{
    if(ev.reverted&&ev.reverted.length){toast(`${ev.reverted[0]} turned back into a polyp! Cool the tank to bring it back.`);sfx.chime();}
    else if(ev.released){toast(`${ev.released} baby ${ev.released>1?'jellies':'jelly'} budded off! Warm the tank back up when you are ready.`);sfx.hatch();}
    else if(ev.settled){toast('A larva settled as a polyp colony.');sfx.hatch();}
    else if(S.stats.hatched>hatchedBefore){toast(`${S.stats.hatched-hatchedBefore} new ${S.stats.hatched-hatchedBefore>1?'babies':'baby'} hatched!`);sfx.hatch();}
    if(ev.sick){toast('Someone is feeling sick. Check the tank.');sfx.sick();}
  }
  refreshActive();
  flushJuice();
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    return (o&&Array.isArray(o.fish))?o:null;
  }catch(e){return null;}
}
async function start(){
  sceneInit();
  buildNav();
  $('#tankHint').textContent='Filling the tank...';
  const local=loadLocal();
  let remote=null,remoteDone=false;
  const rp=initRemote().then(r=>{remote=r;remoteDone=true;return r;});
  await Promise.race([rp,new Promise(r=>setTimeout(r,2500))]);
  let src=local;
  if(remote){
    saveState.doc=remote.doc;
    saveState.status='Saved to your account and this device.';
    if(remote.data&&(!local||(remote.data.savedAt||0)>(local.savedAt||0)+1000)) src=remote.data;
  }
  if(src&&Array.isArray(src.fish)) S=normalize(src); else newGame();
  saveState.allowed=true;
  afterLoad();
  sceneStart();
  setInterval(tick,2000);
  setInterval(saveNow,45000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){sceneStop();saveNow();try{if(SND.ctx&&SND.ctx.state==='running') SND.ctx.suspend();}catch(e){}}
    else{sceneStart();tick();audioResume();}
  });
  window.addEventListener('pagehide',saveNow);
  ['pointerdown','touchend','keydown'].forEach(n=>document.addEventListener(n,audioResume,{passive:true}));
  if(!remoteDone){
    rp.then(r=>{
      if(!r) return;
      saveState.doc=r.doc;
      saveState.status='Saved to your account and this device.';
      if(r.data&&(r.data.savedAt||0)>(S.savedAt||0)+1000){
        S=normalize(r.data);afterLoad();toast('Loaded your saved tank.');
      }else saveNow();
    });
  }
}
function boot(startFn){
  try{
    const h=window.claude&&window.claude.hot;
    if(h&&h.ready) h.ready(()=>startFn());
    else startFn();
  }catch(e){startFn();}
}
/* offline support: only on a real web address, never on file:// or inside the Claude sandbox */
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){
    window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
  }
}catch(e){}
boot(start);
</script>
