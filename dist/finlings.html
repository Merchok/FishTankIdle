<style>
/* Layout concept: a pocket aquarium. Tank window on top, care panel under it, handheld-style tab bar at the bottom. */
:root{
  --bg:#0d1b2b;
  --panel:#15283d;
  --panel2:#1d3551;
  --ink-deep:#091420;
  --line:#2c4b6c;
  --fg:#e8f0f6;
  --muted:#8fa9be;
  --accent:#ffb347;
  --accent-ink:#2b1a00;
  --good:#62d58b;
  --warn:#ffd166;
  --bad:#ff7070;
  --water:#45b7e0;
  --font-ui:'Pixelify Sans',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --font-label:'Silkscreen',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{box-sizing:border-box;touch-action:manipulation;overscroll-behavior:none}
body{
  margin:0;padding-inline:16px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  -webkit-touch-callout:none;overscroll-behavior:none;
  background:var(--bg);color:var(--fg);
  font-family:var(--font-ui);font-size:16px;line-height:1.35;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
#app{width:100%;max-width:560px;height:100%;margin-inline:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
button{font:inherit;color:inherit}
textarea{font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
h2,h3,h4,p{margin:0}
.ic{display:block;flex:none;image-rendering:pixelated}

/* header */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:600;font-size:22px;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brand small{font-family:var(--font-label);font-size:9px;letter-spacing:.12em;color:var(--muted);margin-left:8px;text-transform:uppercase}
.coins{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border:2px solid var(--line);border-radius:4px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;box-shadow:0 3px 0 var(--ink-deep)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink-deep)}

/* main scroller */
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tab{display:none;flex-direction:column;gap:12px}
.tab.on{display:flex}
.sec-title{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hint{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px}

/* tank */
.tankwrap{border:4px solid var(--line);border-radius:6px;background:#06101c;position:relative;box-shadow:0 4px 0 var(--ink-deep)}
#scene{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.tankbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tankbar .info{font-family:var(--font-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini{min-height:36px;padding:0 12px;background:var(--panel);border:2px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;box-shadow:0 2px 0 var(--ink-deep)}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:#ffd9a0}
.mini:active{transform:translateY(1px)}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.meter{min-width:0;display:flex;flex-direction:column;gap:5px}
.meter .row{display:flex;justify-content:space-between;gap:6px;font-family:var(--font-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meter .row b{color:var(--fg);font-family:var(--font-ui);font-size:14px;letter-spacing:0;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#0a1624;border:2px solid var(--ink-deep);border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(9,20,32,.55) 3px 4px);pointer-events:none}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.bar.hp i{background:var(--water)}
.tempnote{font-size:13px;color:var(--muted)}

/* buttons */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.btn{min-height:48px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:2px solid var(--line);border-radius:4px;cursor:pointer;box-shadow:0 3px 0 var(--ink-deep);touch-action:manipulation;text-align:center;line-height:1.15}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink-deep)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:#ffd9a0;font-weight:600}
.btn.danger{background:#5a2330;border-color:#a04558}
.btn:disabled{opacity:.42;cursor:default}
.btn.wide{grid-column:1/-1}
.btn.gold{background:#ffd966;color:#3a2600;border-color:#fff0bd;font-weight:600}
.btn.gold:disabled{background:var(--panel2);color:var(--muted);border-color:var(--line);font-weight:400}
.btn small{font-family:var(--font-label);font-size:9px;letter-spacing:.08em;opacity:.8}
.btn.two{flex-direction:column;gap:3px}
.btn .lbl{display:inline-flex;align-items:center;gap:8px}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:0 4px;min-height:48px;box-shadow:0 3px 0 var(--ink-deep)}
.stepper .val{text-align:center;line-height:1.1}
.stepper .val small{display:block;font-family:var(--font-label);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stepper button{width:40px;height:40px;background:var(--panel);border:2px solid var(--line);border-radius:4px;cursor:pointer;font-size:20px;line-height:1}
.stepper button:active{transform:translateY(1px)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:#0d1b2c;border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip .sw{width:9px;height:9px;border:1px solid rgba(0,0,0,.5)}
.chip.dom{border-color:var(--accent);color:var(--accent)}
.chip.rare{border-style:dashed}
.chip.lock{color:var(--muted);border-style:dashed;opacity:.8}
.chip.good{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.ok{color:var(--water);border-color:var(--water)}

/* fish cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px;cursor:pointer;box-shadow:0 3px 0 var(--ink-deep)}
.fcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink-deep)}
.pic{background:linear-gradient(#2f7fae,#15476d);border-radius:3px;display:grid;place-items:center;overflow:hidden;padding:2px 0}
.pic canvas{image-rendering:pixelated;display:block;width:128px;height:108px;max-width:100%}
.pic.sil canvas{opacity:.95}
.fcard .nm{font-weight:600;overflow-wrap:anywhere}
.fcard .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.fcard.lockd{opacity:.9}
.fcard.picked{border-color:var(--accent)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* breed */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{min-height:150px;align-items:center;justify-content:center;text-align:center}
.slot .empty{color:var(--muted);font-size:14px;padding:30px 4px}
.pred{display:flex;flex-direction:column;gap:9px}
.pred .r{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.pred .r>span{font-family:var(--font-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:5px}
.egg{display:flex;flex-direction:column;gap:6px}
.egg .bar{height:10px}

/* shop */
.shop-item{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.shop-item .pic{width:128px}
.shop-item .pic canvas{width:128px;height:108px}
.shop-item .buy{grid-column:1/-1;flex-direction:row;justify-content:space-between;padding-inline:16px}
.shop-item .txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.shop-item .txt b{font-weight:600}
.shop-item .txt span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.price{display:flex;align-items:center;gap:6px;color:var(--accent);font-variant-numeric:tabular-nums}
.buy{min-width:84px;flex-direction:column;gap:2px;min-height:52px}
.plain-item{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plain-item .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.plain-item .txt span{font-size:13px;color:var(--muted)}

/* book */
.lgrid{display:flex;flex-direction:column;gap:14px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 b{display:block;font-size:22px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.stat3 span{font-family:var(--font-label);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* tab bar */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:4px}
.seg button{min-height:44px;background:transparent;border:0;border-radius:3px;color:var(--muted);cursor:pointer;font-family:var(--font-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;touch-action:manipulation}
.seg button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:var(--panel);border:2px solid var(--line);border-radius:8px}

<script>
'use strict';
/* ================= helpers ================= */

function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}

function mixHex(a,b,t){const A=hexRgb(a),B=hexRgb(b);return rgbHex(A.map((v,i)=>v+(B[i]-v)*t));}
const lighten=(h,t)=>mixHex(h,'#ffffff',t);
const darken=(h,t)=>mixHex(h,'#0b1030',t);
function hash2(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0);}

function expr(key,pair){
  const a=pair[0],b=pair[1];
  if(a===b) return a;
  const o=LOCI[key].opts;
  return (o[a].d||0)>=(o[b].d||0)?a:b;

function phenotype(f){
  const g=f.g;
  return {
    color:expr('color',g.color),accent:expr('accent',g.accent),pattern:expr('pattern',g.pattern),
    tail:expr('tail',g.tail),fin:expr('fin',g.fin),
    size:(g.size[0]+g.size[1])/2,
    sheen:(g.sheen[0]===g.sheen[1]&&g.sheen[0]>0)?g.sheen[0]:0

}
function traitText(ph,kind){
  kind=kind||'fish';
  const p=LD(kind,'pattern').opts[ph.pattern].n;
  const bits=[COLORS[ph.color].n+(ph.pattern?' '+p:'')];
  if(kind!=='shrimp') bits.push(LD(kind,'tail').opts[ph.tail].n+(kind==='jelly'?'':' tail'));

}
function morphKey(f){const ph=phenotype(f);return [f.sp,ph.color,ph.accent,ph.pattern,ph.tail,ph.fin,ph.sheen].join('.')+(f.hyb?'+'+f.hyb:'');}
function rarity(ph){
  let r=0;
  if(COLORS[ph.color].r) r+=1.6;
  if(COLORS[ph.accent].r) r+=0.7;
  r+=[0,0.1,0.15,0.2,0.2,0.25,0.3,1.2][ph.pattern];
  r+=[0,0.1,0.25,0.5,1.3][ph.tail];

  r+=[0,2.5,3][ph.sheen];

}

function defaultState(){

function founderGenes(kind){
  const g={};
  const used=lociOf(kind||'fish');
  for(const k of LOCUS_KEYS){
    const n=LOCI[k].common;
    if(!used.includes(k)||k==='sheen') g[k]=[0,0];
    else g[k]=[ri(0,n-1),ri(0,n-1)];
  }
  return g;
}
function makeFish(sp,g,age,hyb){
  const f={id:S.nextId++,name:pick(NAMES),sp,g,age,trait:pick(TRAITS).id,
    hunger:age>=STAGE_AGE[1]?85:95,health:100,sick:false,cool:0};
  if(hyb) f.hyb=hyb;
  return f;
}
function discoverAlleles(sp,g,id){
  const isNew=!S.book.sp[sp];
  S.book.sp[sp]=1;
  const kind=SP[sp].kind||'fish',found=[];
  for(const k of lociOf(kind)){
    const key=kind+'.'+k;
    const a=S.book.al[key]||(S.book.al[key]={});
    g[k].forEach(i=>{
      if(a[i]) return;
      a[i]=1;
      const L=LD(kind,k),o=L.opts[i];
      if(o.n!=='None') found.push({rare:!!o.r,txt:o.n+' '+L.label.toLowerCase()});
    });
  }
  if(isNew) qJuice({kind:'species',id,msg:'New species: '+SP[sp].n+'!'});
  if(found.length){
    found.sort((x,y)=>y.rare-x.rare);
    const top=found[0];
    qJuice({kind:top.rare?'rare':'gene',id,msg:(top.rare?'Rare gene found: ':'New gene: ')+top.txt+(found.length>1?' (+'+(found.length-1)+' more)':'')+(top.rare?'!':'')});
  }
}
function noteHybrid(sp,hyb){if(hyb){S.book.hyb[hybKey(sp,hyb)]=1;S.stats.hybrids++;}}
function discover(f){
  discoverAlleles(f.sp,f.g,f.id);
  if(f.hyb){
    const k=hybKey(f.sp,f.hyb);
    if(!S.book.hyb[k]){S.book.hyb[k]=1;qJuice({kind:'hyb',id:f.id,msg:'New hybrid: '+hybLabel(f)+'!'});}
  }
  S.book.morph[morphKey(f)]=1;
}
function addFish(f){S.fish.push(f);discover(f);return f;}
function newGame(){

function normalize(o){
  const d=defaultState();
  const s=Object.assign(d,o);
  s.v=2;
  s.feeder=Object.assign(d.feeder,o.feeder||{});
  s.decor={owned:Object.assign({},(o.decor&&o.decor.owned)||{}),slots:((o.decor&&o.decor.slots)||d.decor.slots).slice(0,5)};
  while(s.decor.slots.length<5) s.decor.slots.push(null);
  const al={};
  const oldAl=(o.book&&o.book.al)||{};
  for(const k of Object.keys(oldAl)) al[k.indexOf('.')<0?'fish.'+k:k]=oldAl[k];
  const fixId=id=>id==='lantern'?'nettle':id;
  const bsp={};for(const k of Object.keys((o.book&&o.book.sp)||{})) bsp[fixId(k)]=1;
  const bm={};for(const k of Object.keys((o.book&&o.book.morph)||{})) bm[k.replace(/^lantern\./,'nettle.').replace(/\+lantern$/,'+nettle')]=1;
  s.book={sp:bsp,al,morph:bm,hyb:Object.assign({},(o.book&&o.book.hyb)||{})};
  s.stats=Object.assign(d.stats,o.stats||{});
  s.themes=Object.assign({open:1},o.themes||{});
  for(const f of (o.fish||[]).concat(o.polyps||[])){if(f){f.sp=fixId(f.sp);if(f.hyb) f.hyb=fixId(f.hyb);}}
  s.fish=(o.fish||[]).filter(f=>f&&SP[f.sp]&&f.g&&(!f.hyb||SP[f.hyb]));
  for(const f of s.fish){if(!f.trait||!TRAIT[f.trait]) f.trait=pick(TRAITS).id;}
  s.polyps=(o.polyps||[]).filter(p=>p&&SP[p.sp]&&p.g&&(!p.hyb||SP[p.hyb]));
  s.eggs=(o.eggs||[]).map(e=>{
    e.sp=fixId(e.sp);
    e.kids=(e.kids||[]).map(k=>{if(k&&k.g&&k.sp){k.sp=fixId(k.sp);if(k.hyb) k.hyb=fixId(k.hyb);return k;}return {g:k,sp:e.sp};});
    return e;
  }).filter(e=>SP[e.sp]);
  s.pile=+s.pile||0;
  if(s.pile===0&&s.coinFrac){s.pile=s.coinFrac;s.coinFrac=0;}
  return s;
}
function serialize(){S.savedAt=Date.now();S.lastSeen=Date.now();return JSON.stringify(S);}

/* ================= derived values ================= */
const stageOf=f=>f.age<STAGE_AGE[0]?0:(f.age<STAGE_AGE[1]?1:2);
const stageName=f=>STAGE_NAMES[kindOf(f)][stageOf(f)];
const capacity=()=>TANKS[S.tankLvl].cap;
const weightOf=f=>SP[f.sp].w||1;
const usedSpace=()=>S.fish.reduce((a,f)=>a+weightOf(f),0);
const hasRoom=spId=>usedSpace()+(SP[spId].w||1)<=capacity()+0.001;
const fmtSpace=n=>(Math.round(n*10)/10).toString();
const polypCap=()=>2+S.tankLvl;
function fishValue(f){return Math.round(baseValue(f)*(1+0.6*rarity(phenotype(f))));}
function sellPrice(f){return Math.max(1,Math.round(fishValue(f)*[0.3,0.45,0.6][stageOf(f)]));}
function incomePerHour(f){
  if(f.sick||stageOf(f)<1||f.hunger<=25) return 0;
  return fishValue(f)*0.1*(stageOf(f)===2?1:0.5);
}
function tempOff(f){const sp=rangeOf(f);return S.temp<sp.lo?sp.lo-S.temp:(S.temp>sp.hi?S.temp-sp.hi:0);}
const wasteLimit=f=>SP[f.sp].sens?40:55;
function mood(f){
  if(f.sick) return ['Sick','bad'];
  if(f.hunger<25) return ['Starving','bad'];
  if(f.hunger<45) return ['Hungry','warn'];
  if(S.waste>wasteLimit(f)+5) return ['Stressed','warn'];
  if(tempOff(f)>0.5) return ['Chilly or hot','warn'];
  if(f.health>75&&f.hunger>60&&S.waste<wasteLimit(f)-15) return ['Happy','good'];
  return ['Content','ok'];
}
const plantCount=()=>S.decor.slots.filter(id=>id&&DECOR[id].plant).length;
const sickCount=()=>S.fish.filter(f=>f.sick).length;
const isBerried=f=>S.eggs.some(e=>e.carrier===f.id);
function cloneGenes(g){const o={};for(const k of LOCUS_KEYS) o[k]=g[k].slice();return o;}

/* ================= simulation ================= */
function newFry(sp,g,hyb){
  const f=makeFish(sp,g,0,hyb);
  f.hunger=80;
  return f;
}
function newPolyp(sp,g,hyb){
  const p={id:S.nextId++,sp,g,size:1,chill:0,born:Date.now()};
  if(hyb) p.hyb=hyb;
  return p;
}
function step(dt,ev){
  const T=TANKS[S.tankLvl],F=FILTERS[S.filterLvl];
  S.temp+=clamp(S.heater-S.temp,-dt*0.1,dt*0.1);
  S.filter=Math.max(0,S.filter-dt*100/(F.life*60));
  let load=0,eaters=0;
  for(const f of S.fish){
    const st=stageOf(f);
    load+=[0.35,0.7,1][st]*(SP[f.sp].w||1);
    if(SP[f.sp].algae&&st>=1) eaters+=SP[f.sp].algae;
  }
  const fm=Math.max(0.1,1.25-S.filter/100*F.eff);
  const wm=T.dil*(1-0.03*plantCount());
  S.waste=clamp(S.waste+load*0.02*fm*wm*dt,0,100);
  S.algae=clamp(S.algae+(0.012+S.waste*0.0005)*dt-eaters*0.03*dt,0,100);

  const rev=[];
  for(const f of S.fish){
    const before=stageOf(f);
    f.age+=dt;
    const st=stageOf(f),sp=SP[f.sp];
    if(st>before){ev.grown=(ev.grown||0)+1;if(typeof onStageUp==='function') onStageUp(f,st);}
    const tm=f.trait==='greedy'?1.1:(f.trait==='lazy'?0.92:1);
    f.hunger=Math.max(0,f.hunger-100/600*sp.hun*tm*[1.3,1.1,1][st]*dt);
    if(S.feeder.owned&&S.feeder.stock>0&&f.hunger<35){
      f.hunger=Math.min(100,f.hunger+60);S.feeder.stock--;S.waste=Math.min(100,S.waste+0.6);ev.fed++;
    }
    let dmg=0;
    if(f.hunger<25) dmg+=(25-f.hunger)/25*0.16;
    const wl=wasteLimit(f);
    if(S.waste>wl) dmg+=(S.waste-wl)/(100-wl)*0.18;
    if(S.algae>85) dmg+=0.03;
    const off=tempOff(f);
    if(off>0.5) dmg+=Math.min(off,6)*0.05;
    if(dmg>0) f.health-=dmg*dt;
    else if(f.hunger>40&&S.waste<wl-10) f.health+=0.1*dt;
    f.health=clamp(f.health,5,100);
    if(!f.sick&&f.health<35){
      if(sp.immortal&&st>=1&&S.polyps.length+rev.length<polypCap()) rev.push(f);
      else{f.sick=true;ev.sick++;}
    }else if(f.sick&&f.health>=60) f.sick=false;
    f.cool=Math.max(0,f.cool-dt);
    S.pile+=incomePerHour(f)/60*dt;
  }

  for(const f of rev){
    S.fish=S.fish.filter(x=>x!==f);
    const p=newPolyp(f.sp,cloneGenes(f.g),f.hyb);p.size=2;p.was=f.name;
    S.polyps.push(p);ev.reverted.push(f.name);
  }

  /* eggs and larvae */
  for(const egg of S.eggs){
    egg.t=Math.max(0,egg.t-dt);
    if(egg.t>0) continue;
    const keep=[];
    for(const kid of egg.kids){
      if(viaPolyp(kid.sp)){
        if(S.polyps.length<polypCap()){
          S.polyps.push(newPolyp(kid.sp,kid.g,kid.hyb));discoverAlleles(kid.sp,kid.g);noteHybrid(kid.sp,kid.hyb);ev.settled=(ev.settled||0)+1;
        }else keep.push(kid);
      }else if(hasRoom(kid.sp)){
        const nf=addFish(newFry(kid.sp,kid.g,kid.hyb));qJuice({kind:'hatch',id:nf.id});noteHybrid(kid.sp,kid.hyb);S.stats.hatched++;ev.hatched++;
      }else keep.push(kid);
    }
    egg.kids=keep;
  }
  S.eggs=S.eggs.filter(e=>e.kids.length>0);

  /* jellyfish polyps: slow growth, cold wakes them up */
  for(const p of S.polyps){
    const cold=coldOf(p);
    if(S.waste<60) p.size=Math.min(8,p.size+dt/150);
    if(S.temp<=cold+0.2) p.chill+=dt; else p.chill=Math.max(0,p.chill-dt*0.5);
    if(p.chill>=POLYP_CHILL_MIN&&p.size>=2){
      const want=clamp(Math.floor(p.size/2),1,4);
      let made=0;
      while(made<want&&hasRoom(p.sp)){
        const nf=addFish(newFry(p.sp,cloneGenes(p.g),p.hyb));
        if(p.was){nf.name=p.was;delete p.was;}
        qJuice({kind:'hatch',id:nf.id});
        made++;
      }
      if(made){
        p.size=Math.max(1,p.size-made*1.5);p.chill=0;
        ev.released=(ev.released||0)+made;S.stats.released++;
      }
    }
  }
}
function simulate(mins){
  const ev={coins:0,hatched:0,sick:0,fed:0,grown:0,settled:0,released:0,reverted:[]};
  const pile0=S.pile;
  let left=mins;
  while(left>0.0001){const dt=Math.min(10,left);left-=dt;step(dt,ev);}
  ev.coins=Math.max(0,S.pile-pile0);
  return ev;
}

/* ================= breeding ================= */
function inherit(key,pair){
  let a=pair[Math.random()<0.5?0:1];
  if(Math.random()<MUT) a=mutateAllele(key,a);
  return a;
}
function mutateAllele(key,cur){
  const o=LOCI[key].opts,rare=[],common=[];
  for(let i=0;i<o.length;i++){if(i===cur) continue;(o[i].r?rare:common).push(i);}
  const pool=(rare.length&&Math.random()<0.55)?rare:(common.length?common:rare);
  return pick(pool);
}
function crossGenes(a,b){
  const g={};
  const used=lociOf(kindOf(a));
  for(const k of LOCUS_KEYS) g[k]=used.includes(k)?[inherit(k,a.g[k]),inherit(k,b.g[k])]:[0,0];
  return g;
}
function breedBlock(f){
  if(f.hyb) return 'Hybrids are sterile';
  if(stageOf(f)<2) return 'Still growing';
  if(f.sick) return 'Sick';
  if(f.hunger<30) return 'Too hungry';
  if(f.cool>0) return 'Resting '+fmtDur(f.cool);
  return '';
}
function pairBlock(a,b){
  if(!a||!b) return 'Choose two';
  if(kindOf(a)!==kindOf(b)) return 'Same kind only';
  if(S.eggs.length>=NURSERY_MAX) return 'The nursery is full';
  return breedBlock(a)||breedBlock(b)||'';
}
function doBreed(a,b){
  const kind=kindOf(a),mixed=a.sp!==b.sp;
  const bothDirect=!!SP[a.sp].direct&&!!SP[b.sp].direct;
  const n=kind==='jelly'?(bothDirect?ri(2,3):ri(1,2)):(kind==='shrimp'?ri(3,6):ri(2,4));
  const kids=[];
  for(let i=0;i<n;i++){
    const kid={g:crossGenes(a,b),sp:a.sp};
    if(mixed){kid.sp=Math.random()<0.5?a.sp:b.sp;kid.hyb=kid.sp===a.sp?b.sp:a.sp;}
    kids.push(kid);
  }
  const total=bothDirect?35:EGG_BY_KIND[kind];
  const egg={id:S.nextId++,sp:a.sp,t:total,total,kids,parents:[a.name,b.name]};
  if(kind==='shrimp') egg.carrier=(Math.random()<0.5?a:b).id;
  S.eggs.push(egg);
  a.cool=b.cool=COOLDOWN_MIN;
  S.stats.bred++;
  return {n,kind,total,mixed,direct:bothDirect,poly:kids.some(k=>viaPolyp(k.sp))};
}
/* chance table for one locus given two parents (ignores mutation) */
function predictLocus(key,a,b){
  const kind=kindOf(a),L=LD(kind,key);
  const map=new Map();
  for(const x of a.g[key]) for(const y of b.g[key]){
    let label,sw=null,rare=false;
    if(key==='size'){label=SIZE_NAMES[(x+y)];}
    else if(key==='sheen'){const v=(x===y&&x>0)?x:0;label=L.opts[v].n;rare=v>0;}
    else{const v=expr(key,[x,y]);label=L.opts[v].n;if(key==='color'||key==='accent') sw=COLORS[v].c;rare=!!L.opts[v].r;}
    const m=map.get(label)||{label,sw,rare,p:0};
    m.p+=0.25;map.set(label,m);
  }
  return [...map.values()].sort((p,q)=>q.p-p.p);
}

/* ================= actions ================= */
function sellFish(f){
  const p=sellPrice(f);
  S.coins+=p;S.stats.sold++;
  S.fish=S.fish.filter(x=>x!==f);
  S.eggs.forEach(e=>{if(e.carrier===f.id) e.carrier=null;});
  return p;
}
function collectPile(){
  const n=Math.floor(S.pile);
  if(n<1) return 0;
  S.pile-=n;S.coins+=n;S.stats.earned+=n;
  return n;
}
function needsAttention(){
  if(!S) return false;
  return S.fish.some(f=>f.hunger<35||f.sick)||S.waste>55||S.algae>75||S.filter<15||S.pile>=1;
}
function dayLight(){
  const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  const up=clamp((h-5.5)/2.5,0,1),down=clamp((20.5-h)/2.5,0,1);
  return Math.min(up,down);
}
/* ================= sound (synthesized, no files) ================= */
const SND={ctx:null,master:null,noiseBuf:null,lastEat:0,lastBub:0,lastTink:0};
function audioResume(){
  try{
    if(!SND.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      SND.ctx=new AC();
      SND.master=SND.ctx.createGain();
      SND.master.gain.value=0.55;
      SND.master.connect(SND.ctx.destination);
    }
    if(SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{});
  }catch(e){}
}
const soundOn=()=>!!(SND.ctx&&S&&S.sound&&SND.ctx.state!=='closed');
function tone(freq,dur,o){
  if(!soundOn()) return;
  o=o||{};
  try{
    const c=SND.ctx,t=c.currentTime+(o.delay||0),vol=o.vol||0.12;
    const osc=c.createOscillator(),g=c.createGain();
    osc.type=o.type||'sine';
    if(o.j) freq*=1+(Math.random()*2-1)*o.j;
    osc.frequency.setValueAtTime(freq,t);

}
function noise(dur,o){

    if(!SND.noiseBuf){

    const f=c.createBiquadFilter();f.type=o.type||'lowpass';

    if(o.sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60,(o.freq||1000)*o.sweep),t+dur);
    f.Q.value=o.q||0.8;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.vol||0.12,t+Math.min(0.05,dur/3));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f);f.connect(g);g.connect(SND.master);
    src.start(t,Math.random()*0.5);src.stop(t+dur+0.03);

}

/* ================= sprite helpers ================= */
const SPRITES=new Map();
const rgba=(hex,a)=>{const c=hexRgb(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
function prof(shape,u){
  switch(shape){
    case 'slim': return Math.pow(Math.sin(Math.PI*Math.min(1,u*0.92+0.04)),0.7);
    case 'oval': case 'bottom': {const c=.42,d=u<c?(c-u)/c:(u-c)/(1-c);return Math.sqrt(Math.max(0,1-d*d));}
    case 'round': case 'disc': return Math.sqrt(Math.max(0,1-Math.pow(2*u-1,2)));
    case 'tall': return Math.max(0,1-Math.pow(Math.abs(u-0.5)*2,1.5));
    case 'long': return Math.pow(Math.sin(Math.PI*(u*0.94+0.03)),0.3);
  }
  return 1;
}
function getSprite(f,stage,sick){
  const key=f.id+'|'+stage+'|'+(sick?1:0);
  let s=SPRITES.get(key);
  if(!s){
    const k=kindOf(f);
    s=k==='shrimp'?buildShrimp(f,stage,sick):(k==='jelly'?buildJelly(f,stage,sick):buildFishSprite(f,stage,sick));
    SPRITES.set(key,s);
  }
  return s;
}
function gridToCanvas(g,W,Hc){
  const cv=document.createElement('canvas');cv.width=W;cv.height=Hc;
  const c=cv.getContext('2d');
  for(let y=0;y<Hc;y++) for(let x=0;x<W;x++) if(g[y][x]){c.fillStyle=g[y][x];c.fillRect(x,y,1,1);}
  return cv;
}
const emptyGrid=(W,Hc)=>Array.from({length:Hc},()=>new Array(W).fill(null));

/* ================= fish sprite ================= */
function buildFishSprite(f,stage,sick){
  const sp=spriteSpec(f),ph=phenotype(f);
  const tc=c=>sick?mixHex(c,'#7d8a70',0.55):c;
  const sm=(0.88+0.12*ph.size)*1.25, stm=[0.45,0.75,1][stage];
  const L=Math.max(5,Math.round(sp.len*sm*stm)), H=Math.max(3,Math.round(sp.hei*sm*stm));
  const tt=ph.tail;
  const TL=Math.max(2,Math.round(L*[0.34,0.3,0.4,0.62,0.8][tt]*sp.tailMul));
  const TH=Math.max(3,Math.round(H*[0.9,0.75,1.3,1.25,0.6][tt]*(sp.tailMul>1?1.1:1)));
  const FH=Math.min(Math.round(H*0.85),Math.round(H*[0,0.3,0.62,0.85][ph.fin]*sp.finMul));
  const padT=Math.max(FH,Math.ceil((TH-H)/2))+2;
  const padB=Math.max(5,Math.ceil((TH-H)/2)+2)+(tt===3?Math.round(TL*0.2):0);
  const W=L+TL+2, Hc=padT+H+padB;
  const g=emptyGrid(W,Hc);
  const base=COLORS[ph.color].c, acc=COLORS[ph.accent].c;
  const hi=lighten(base,0.28), lo=darken(base,0.28);
  const bodyTop=new Array(L).fill(-1), bodyBot=new Array(L).fill(-1);
  const midY=Math.floor(H/2);
  for(let x=0;x<L;x++){
    const u=(x+0.5)/L;
    let hh=prof(sp.shape,u)*H/2;
    if(sp.shape==='bottom') hh*=1.25;
    for(let y=0;y<H;y++){
      const dy=y+0.5-H/2;
      const inside=sp.shape==='bottom'?(dy>=-hh&&dy<=hh*0.22):(Math.abs(dy)<=hh);
      if(!inside) continue;
      const v=dy/Math.max(hh,0.6);
      let col=v<-0.45?hi:(v>0.5?lo:base);
      const hs=hash2(x,y);
      let on=false;
      switch(ph.pattern){
        case 1: on=(y===midY||(H>=10&&y===midY-1))&&u>0.12&&u<0.96;break;
        case 2: on=(hs%9===0)&&u>0.2;break;
        case 3: on=u>0.25&&u<0.85&&(x%4<2);break;
        case 4: on=v>0.15&&u>0.1;break;
        case 5: on=u<0.3;break;
        case 6: on=(hs%4===0);break;
        case 7: on=((x+y)%4<2)&&u>0.15;break;
      }
      if(on) col=v<-0.45?lighten(acc,0.15):(v>0.5?darken(acc,0.2):acc);
      if(ph.sheen===2&&v<-0.45) col=mixHex(col,'#ffffff',0.55);
      g[padT+y][1+x]=tc(col);
      if(bodyTop[x]<0) bodyTop[x]=y;
      bodyBot[x]=y;
    }
  }
  const cyB=padT+H/2;
  for(let t=0;t<TL;t++){
    const x=1+L+t,q=(t+0.5)/TL;
    let th,drop=0;
    switch(tt){
      case 0: th=TH/2*(0.45+0.55*q);break;
      case 1: {const d=(q-0.4)/0.6;th=Math.max(TH/2*0.3,TH/2*Math.sqrt(Math.max(0,1-d*d)));break;}
      case 2: th=TH/2*(0.3+0.7*q);break;
      case 3: th=TH/2*(0.35+0.65*Math.sin(Math.PI*Math.pow(q,0.75)));drop=t*0.16;break;
      default: th=TH/2*(0.45+0.55*q);
    }
    for(let y=0;y<Hc;y++){
      const dy=y+0.5-cyB-drop,ad=Math.abs(dy);
      let inT=ad<=th;
      if(tt===0&&q>0.35) inT=inT&&ad>=(q-0.35)/0.65*th*0.75;
      if(tt===4) inT=(Math.abs(ad-th*0.92)<0.75||ad<0.55);
      if(tt===2&&t===TL-1&&y%2===0) inT=false;
      if(!inT) continue;
      let col;
      if(tt<=1) col=mixHex(base,acc,0.4);
      else if(tt===3) col=mixHex(acc,lighten(acc,0.4),q*0.6);
      else col=acc;
      g[y][x]=tc(col);
    }
  }
  if(FH>0){
    const x0=Math.round(L*0.25),x1=Math.max(x0+2,Math.round(L*0.74));
    for(let x=x0;x<x1&&x<L;x++){
      const top=bodyTop[x];if(top<0) continue;
      const u=(x-x0)/(x1-x0);
      let h=ph.fin===3?FH*(0.7+0.3*Math.sin(u*Math.PI*3)):FH*Math.max(0.25,1-Math.abs(u-0.3)/0.7);
      if(ph.fin===3&&x%3===0) h*=0.6;
      const n=Math.max(1,Math.round(h));
      for(let k=1;k<=n;k++){
        const y=padT+top-k;
        if(y>=1&&!g[y][1+x]) g[y][1+x]=tc(ph.fin===1?darken(base,0.1):mixHex(acc,base,0.2));
      }
    }
  }
  if(L>=9){
    const x=Math.round(L*0.38),b=bodyBot[x];
    if(b>=0){g[padT+b+1][1+x]=tc(darken(acc,0.1));if(L>=14) g[padT+b+2][1+x]=tc(darken(acc,0.1));}
  }
  if(L>=10){
    const x=Math.round(L*0.3),y=padT+Math.floor(H*0.6);
    if(g[y]&&g[y][1+x]) g[y][1+x]=tc(lighten(base,0.35));
  }
  {
    const bx=Math.max(1,Math.round(L*0.16)),by=bodyTop[bx];
    if(by>=0){
      const ey=padT+Math.min(bodyBot[bx],by+Math.max(1,Math.round(H*0.24)));
      g[ey][1+bx]='#0b1030';
      if(L>=11&&g[ey][2+bx]) g[ey][2+bx]='#ffffff';
    }
  }
  const oc=tc(darken(base,0.62));
  const out=g.map(r=>r.slice());
  for(let y=0;y<Hc;y++) for(let x=0;x<W;x++){
    if(g[y][x]) continue;
    if((y>0&&g[y-1][x])||(y<Hc-1&&g[y+1][x])||(x>0&&g[y][x-1])||(x<W-1&&g[y][x+1])) out[y][x]=oc;
  }
  return {cv:gridToCanvas(out,W,Hc),w:W,h:Hc,glow:ph.sheen===1,pearl:ph.sheen===2,glowRGB:[255,255,190],feet:Hc-3};
}

/* ================= shrimp sprite ================= */
function buildShrimp(f,stage,sick){
  const sp=spriteSpec(f),ph=phenotype(f);
  const tc=c=>sick?mixHex(c,'#7d8a70',0.55):c;
  const sm=(0.88+0.12*ph.size)*1.25, stm=[0.5,0.78,1][stage];
  const L=Math.max(7,Math.round(sp.len*sm*stm)), H=Math.max(4,Math.round(sp.hei*sm*stm));
  const ant=Math.max(3,Math.round(L*0.7));
  const W=ant+L+5, Hc=H+Math.round(H*1.1)+9;
  const g=emptyGrid(W,Hc);
  const ghost=!!sp.ghost;
  const base=ghost?mixHex(COLORS[ph.color].c,'#d8f0f5',0.62):COLORS[ph.color].c;
  const acc=COLORS[ph.accent].c;
  const x0=ant+2,yTop=Math.round(H*0.9)+3;
  const cx=t=>x0+t*(L-1);
  const cy=t=>yTop+H*0.55-Math.sin(Math.PI*Math.min(1,t*0.9))*H*0.3+(t>0.72?(t-0.72)*H*2.4:0);
  const rad=t=>t<0.2?H*0.44:Math.max(0.9,H*0.5*(1-0.62*Math.max(0,t-0.2)));
  const steps=L*5;
  const alpha=ghost?0.6:1;
  const body=new Map();
  for(let k=0;k<=steps;k++){
    const t=k/steps,px=cx(t),py=cy(t),r=rad(t);
    for(let y=Math.floor(py-r);y<=Math.ceil(py+r);y++) for(let x=Math.floor(px-r);x<=Math.ceil(px+r);x++){
      const dx=x+0.5-px,dy=y+0.5-py;
      if(dx*dx+dy*dy<=r*r){
        const key=y*1000+x,prev=body.get(key);
        if(!prev||t>prev.t) body.set(key,{x,y,t,v:dy/Math.max(r,0.8)});
      }
    }
  }
  const midY=Math.round(yTop+H*0.5);
  for(const b of body.values()){
    const hs=hash2(b.x,b.y);
    let col=b.v<-0.4?lighten(base,0.25):(b.v>0.45?darken(base,0.25):base);
    let on=false;
    switch(ph.pattern){
      case 1: on=b.v>-0.85&&b.v<-0.3&&b.t>0.12;break;
      case 2: on=(hs%7===0)&&b.t>0.15;break;
      case 3: on=(b.t>0.34&&b.t<0.5)||(b.t>0.7&&b.t<0.84);break;
      case 4: on=b.v>0.3;break;
      case 5: on=b.t<0.22;break;
      case 6: on=(hs%4===0);break;
      case 7: on=((b.x+b.y)%4<2)&&b.t>0.1;break;
    }
    if(on) col=b.v<-0.4?lighten(acc,0.15):(b.v>0.45?darken(acc,0.2):acc);
    if(ph.sheen===2&&b.v<-0.4) col=mixHex(col,'#ffffff',0.55);
    g[b.y][b.x]=ghost&&!on?rgba(tc(col),alpha):tc(col);
  }
  if(ghost){
    for(let t=0.25;t<=0.82;t+=0.04){const x=Math.round(cx(t)),y=Math.round(cy(t)+rad(t)*0.1);if(g[y]&&g[y][x]) g[y][x]=rgba(tc(darken(acc,0.2)),0.85);}
  }
  const tipX=Math.round(cx(1)),tipY=Math.round(cy(1));
  const fanCol=ghost?rgba(tc(lighten(base,0.2)),0.75):tc(mixHex(base,acc,0.35));
  [[1,-1],[1,0],[1,1],[2,0],[0,2],[1,2]].forEach(o=>{const x=tipX+o[0],y=tipY+o[1];if(g[y]&&x<W&&!g[y][x]) g[y][x]=fanCol;});
  const legCol=tc(darken(base,0.35));
  for(let t=0.14;t<0.6;t+=0.1){
    const x=Math.round(cx(t)),y=Math.round(cy(t)+rad(t))+1;
    if(g[y]&&!g[y][x]) g[y][x]=ghost?rgba(legCol,0.7):legCol;
    if(L>=12&&g[y+1]&&!g[y+1][x-1]) g[y+1][x-1]=ghost?rgba(legCol,0.6):legCol;
  }
  const ac=tc(lighten(acc,0.3));
  const hx=cx(0)-rad(0)*0.7,hy=cy(0)-rad(0)*0.5;
  for(let k=0;k<ant;k++){
    const x=Math.round(hx-k),y=Math.round(hy-k*0.3-Math.sin(k*0.35)*0.8);
    if(g[y]&&x>=0&&!g[y][x]) g[y][x]=rgba(ac,0.85);
    if(k<ant*0.7){const y2=Math.round(hy+0.5+k*0.12);if(g[y2]&&x>=0&&!g[y2][x]) g[y2][x]=rgba(ac,0.65);}
  }
  const rx=Math.round(cx(0)-rad(0)),ry=Math.round(cy(0)-rad(0))-1;
  if(g[ry]&&!g[ry][rx]) g[ry][rx]=tc(darken(base,0.1));
  const ex=Math.round(cx(0)-rad(0)*0.35),ey=Math.round(cy(0)-rad(0)*0.45);
  if(g[ey]&&g[ey][ex]) g[ey][ex]='#0b1030';
  let feet=0;
  for(let y=0;y<Hc;y++) for(let x=0;x<W;x++) if(g[y][x]) feet=Math.max(feet,y);
  if(!ghost){
    const oc=tc(darken(base,0.62));
    const out=g.map(r=>r.slice());
    for(let y=0;y<Hc;y++) for(let x=0;x<W;x++){
      if(g[y][x]) continue;
      if((y>0&&g[y-1][x]&&body.has((y-1)*1000+x))||(y<Hc-1&&g[y+1][x]&&body.has((y+1)*1000+x))||(x>0&&g[y][x-1]&&body.has(y*1000+x-1))||(x<W-1&&g[y][x+1]&&body.has(y*1000+x+1))) out[y][x]=oc;
    }
    for(let y=0;y<Hc;y++) for(let x=0;x<W;x++) g[y][x]=out[y][x];
  }
  const eggPos={x:Math.round(cx(0.78)),y:Math.round(cy(0.78)+rad(0.78))+2};
  return {cv:gridToCanvas(g,W,Hc),w:W,h:Hc,glow:ph.sheen===1,pearl:ph.sheen===2,glowRGB:[255,255,190],feet:feet+1,eggPos};
}

/* ================= card previews ================= */
function paintFish(cv,f,opts){
  opts=opts||{};
  const c=cv.getContext('2d');
  c.imageSmoothingEnabled=false;
  c.clearRect(0,0,cv.width,cv.height);
  const st=opts.stage!=null?opts.stage:stageOf(f);
  const s=getSprite(f,st,opts.sick!=null?opts.sick:f.sick);
  const x=Math.round((cv.width-s.w)/2),y=Math.round((cv.height-s.h)/2);
  if(s.glow){
    const gc=s.glowRGB.join(',');
    const gr=c.createRadialGradient(cv.width/2,cv.height/2,2,cv.width/2,cv.height/2,Math.max(s.w,s.h)*0.85);
    gr.addColorStop(0,'rgba('+gc+',.5)');gr.addColorStop(1,'rgba('+gc+',0)');
    c.fillStyle=gr;c.fillRect(0,0,cv.width,cv.height);
  }
  c.drawImage(s.cv,x,y);
  if(opts.silhouette){
    c.globalCompositeOperation='source-atop';
    c.fillStyle='#10233a';c.fillRect(0,0,cv.width,cv.height);
    c.globalCompositeOperation='source-over';
  }
}
function previewFish(spId,hyb){

    :{color:[5,5],accent:[2,2],pattern:[1,1],tail:[0,0],fin:[1,1],size:[1,1],sheen:[0,0]};

}
function paintAllCanvases(root){
  $$('canvas[data-fish]',root).forEach(cv=>{
    const f=S.fish.find(x=>x.id==cv.dataset.fish);
    if(f) paintFish(cv,f);
  });
  $$('canvas[data-species]',root).forEach(cv=>{
    const p=previewFish(cv.dataset.species);
    const known=!!S.book.sp[cv.dataset.species];
    paintFish(cv,p,{stage:2,silhouette:cv.dataset.sil==='1'&&!known});
  });
  $$('canvas[data-hyb]',root).forEach(cv=>{
    const [a,b]=cv.dataset.hyb.split(':');
    paintFish(cv,previewFish(a,b),{stage:2});
  });
  $$('canvas[data-polyp]',root).forEach(cv=>{
    const p=S.polyps.find(x=>x.id==cv.dataset.polyp);
    const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);
    if(!p) return;
    c.save();c.translate(cv.width/2,cv.height-8);c.scale(2,2);
    drawPolyp(c,p,0,0,0);
    c.restore();
  });
}

/* ================= polyps ================= */
function drawPolyp(c,p,x,y,t){
  const ph=phenotype(p);
  const base=COLORS[ph.color].c,acc=COLORS[ph.accent].c;
  const stalk=lighten(base,0.35);
  const cnt=clamp(Math.floor(p.size)+1,1,8);
  const OX=[-7,-3,1,5,-5,-1,3,7],OY=[0,1,0,1,-3,-2,-3,-2];
  for(let i=0;i<cnt;i++){
    const ox=x+OX[i],oy=y+OY[i];
    R(c,'#7c8698',ox-1,oy,4,1);
    R(c,stalk,ox,oy-3,2,3);
    const sw=Math.sin(t*2+i)>0?1:0;
    R(c,acc,ox-1+sw,oy-5,1,2);R(c,acc,ox+2-sw,oy-5,1,2);R(c,acc,ox,oy-5,2,1);
    if(p.chill>10&&Math.floor(t*3+i)%2===0) R(c,'#bfe9ff',ox,oy-7,1,1);
  }
}
